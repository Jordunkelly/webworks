      // REAL LEGO LAW & STRUCTURAL SUPPORT GRAPH SOLVER (Clutch Power + Cantilever + Cascade Gravity)
      function bricksOverlapX(a, b) {
        return a.x < b.x + b.w - 2 && a.x + a.w > b.x + 2;
      }

      function isDirectlyOnSolidGround(b) {
        if (Math.abs((b.y + b.h) - legoState.floorY) > 4) return false;
        const startCol = Math.round(b.x / LEGO_STUD_W);
        const endCol = Math.round((b.x + b.w) / LEGO_STUD_W);
        for (let col = startCol; col < endCol; col++) {
          if (!isRiverStud(col)) return true;
        }
        return false;
      }

      function runLegoStructuralPhysics() {
        if (!legoState) return;
        const bricks = legoState.bricks;
        const supported = new Set();
        const queue = [];

        bricks.forEach((b, idx) => {
          if (b.launching) {
            supported.add(idx);
            return;
          }
          if (b.isPermanent || isDirectlyOnSolidGround(b)) {
            supported.add(idx);
            queue.push(idx);
          }
        });

        const noTopStuds = ['horn', 'crown', 'roof', 'flag', 'rotor', 'crystal'];
        while (queue.length > 0) {
          const currIdx = queue.shift();
          const curr = bricks[currIdx];

          for (let i = 0; i < bricks.length; i++) {
            if (supported.has(i)) continue;
            const other = bricks[i];
            if (!bricksOverlapX(curr, other)) continue;

            const otherSittingOnCurr = Math.abs((other.y + other.h) - curr.y) <= 4 && !noTopStuds.includes(curr.shape);
            const otherHangingUnderCurr = Math.abs((curr.y + curr.h) - other.y) <= 4 && !noTopStuds.includes(other.shape);

            if (otherSittingOnCurr || otherHangingUnderCurr) {
              supported.add(i);
              queue.push(i);
            }
          }
        }

        bricks.forEach((b, idx) => {
          if (b.launching) return;
          if (!supported.has(idx)) {
            b.falling = true;
          } else {
            b.falling = false;
            b.vy = 0;
            b.y = Math.round(b.y / LEGO_BRICK_H) * LEGO_BRICK_H;
          }
        });
      }

      function computeSnapTarget(wx, wy, shapeId) {
        const sh = LEGO_BRICK_SHAPES.find(s => s.id === shapeId) || LEGO_BRICK_SHAPES[0];
        const snapX = Math.max(0, Math.min(LEGO_WORLD_W - sh.w, Math.round((wx - sh.w / 2) / LEGO_STUD_W) * LEGO_STUD_W));
        let snapY = Math.min(legoState.floorY - sh.h, Math.max(LEGO_BRICK_H, Math.round((wy - sh.h / 2) / LEGO_BRICK_H) * LEGO_BRICK_H));

        let resolved = false;
        let guard = 0;
        while (!resolved && guard < 20) {
          guard++;
          const collider = legoState.bricks.find(b =>
            b !== legoState.grabbedBrick &&
            snapX < b.x + b.w - 2 &&
            snapX + sh.w > b.x + 2 &&
            snapY < b.y + b.h - 2 &&
            snapY + sh.h > b.y + 2
          );
          if (collider) {
            snapY = collider.y - sh.h;
          } else {
            resolved = true;
          }
        }

        return { x: snapX, y: Math.max(LEGO_BRICK_H, snapY), w: sh.w, h: sh.h };
      }

      // Pointer / Touch Interaction on the Full-Screen LEGO Canvas
      fCanvas.onpointerdown = (e) => {
        const rect = fCanvas.getBoundingClientRect();
        const wx = (e.clientX - rect.left) * (fCanvas.width / rect.width) + legoState.camX;
        const wy = (e.clientY - rect.top) * (fCanvas.height / rect.height);

        // Have the Cute LEGO Unicorn trot toward the work site!
        legoState.person.targetWalkX = Math.max(24, Math.min(LEGO_WORLD_W - 64, wx - 48));

        // 1. Check if tapping a glowing blueprint slot directly
        const hitBlueprint = legoState.blueprints.find(bp =>
          !bp.filled &&
          wx >= bp.x - 12 && wx <= bp.x + bp.w + 12 &&
          wy >= bp.y - 12 && wy <= bp.y + bp.h + 12
        );
        if (hitBlueprint && legoState.tool === 'build') {
          legoState.placeBrickAt(hitBlueprint.x, hitBlueprint.y, hitBlueprint.shape, hitBlueprint.colorObj, false);
          return;
        }

        // 2. Check if tapping an existing placed brick for Pry / Paint / Grab
        const hitBrickIdx = legoState.bricks.findIndex(b =>
          wx >= b.x && wx <= b.x + b.w &&
          wy >= b.y && wy <= b.y + b.h
        );

        if (legoState.tool === 'pry') {
          if (hitBrickIdx !== -1 && !legoState.bricks[hitBrickIdx].isPermanent) {
            const removed = legoState.bricks.splice(hitBrickIdx, 1)[0];
            legoState.person.armSwing = 1.2;
            playMagicSound('legoBreak');
            legoState.spawnFlyingDebris(removed.x + removed.w / 2, removed.y + removed.h / 2, removed.colorObj.hex, 12);
            runLegoStructuralPhysics();
          }
          return;
        }

        if (legoState.tool === 'paint') {
          if (hitBrickIdx !== -1) {
            legoState.bricks[hitBrickIdx].colorObj = legoState.selectedColor;
            legoState.person.armSwing = 1.0;
            playMagicSound('legoSnap');
          }
          return;
        }

        if (legoState.tool === 'grab') {
          if (hitBrickIdx !== -1 && !legoState.bricks[hitBrickIdx].isPermanent) {
            legoState.grabbedBrick = legoState.bricks.splice(hitBrickIdx, 1)[0];
            playMagicSound('pop');
            runLegoStructuralPhysics();
          }
          return;
        }

        // 3. Build Tool: Snap or Drop a new LEGO brick!
        const target = computeSnapTarget(wx, wy, legoState.selectedShape);
        legoState.placeBrickAt(target.x, target.y, legoState.selectedShape, legoState.selectedColor, false);
      };

      fCanvas.onpointermove = (e) => {
        const rect = fCanvas.getBoundingClientRect();
        const wx = (e.clientX - rect.left) * (fCanvas.width / rect.width) + legoState.camX;
        const wy = (e.clientY - rect.top) * (fCanvas.height / rect.height);

        const shapeId = legoState.grabbedBrick ? legoState.grabbedBrick.shape : legoState.selectedShape;
        const snap = computeSnapTarget(wx, wy, shapeId);
        legoState.ghost = {
          active: true,
          x: snap.x,
          y: snap.y,
          w: snap.w,
          h: snap.h,
          shape: shapeId,
          colorObj: legoState.grabbedBrick ? legoState.grabbedBrick.colorObj : legoState.selectedColor,
          valid: true
        };
      };

      fCanvas.onpointerup = () => {
        if (legoState.grabbedBrick && legoState.ghost.active) {
          const gb = legoState.grabbedBrick;
          legoState.grabbedBrick = null;
          legoState.placeBrickAt(legoState.ghost.x, legoState.ghost.y, gb.shape, gb.colorObj, false);
        }
      };

      // Trot & Fly-Jump Controls for the Cute LEGO Unicorn Builder!
      const bindWalkBtn = (id, dir) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        const start = (e) => {
          e.preventDefault();
          legoState.person.targetWalkX = null;
          legoState.keys[dir] = true;
        };
        const stop = (e) => {
          e.preventDefault();
          legoState.keys[dir] = false;
        };
        btn.onpointerdown = start;
        btn.onpointerup = stop;
        btn.onpointerleave = stop;
        btn.onpointercancel = stop;
      };
      bindWalkBtn('lego-walk-left', 'left');
      bindWalkBtn('lego-walk-right', 'right');

      const jumpBtn = document.getElementById('lego-walk-jump');
      if (jumpBtn) {
        jumpBtn.onpointerdown = (e) => {
          e.preventDefault();
          const p = legoState.person;
          if (p.onGround) {
            p.vy = -11.2;
            p.onGround = false;
            playMagicSound('legoSnap');
          } else if (p.vy > -3.5) {
            p.vy = -9.6;
            legoState.spawnFlyingDebris(p.x + p.w / 2, p.y + p.h, '#ff80ab', 6);
            playMagicSound('sparkle');
          }
        };
      }

      // Draw Articulated Cute LEGO Unicorn Character (with LEGO hooves, Pegasus wings, rainbow tail, golden horn & held brick!)
      function drawCuteLegoUnicornBuilder(c, p, ts) {
        c.save();
        c.translate(p.x + p.w / 2, p.y + p.h / 2);
        if (p.facing < 0) c.scale(-1, 1);
        c.translate(-p.w / 2, -p.h / 2);

        const swing = Math.sin(p.walkPhase) * 5;
        const wingFlap = Math.sin((ts || performance.now()) * 0.012) * 5;

        // 1. Flowing Pink & Purple LEGO Tail Bricks
        c.fillStyle = '#ab47bc';
        c.fillRect(-6, 22, 8, 7);
        c.fillStyle = '#ec407a';
        c.fillRect(-9, 28, 8, 7);
        c.fillStyle = '#ffd54f';
        c.fillRect(-6, 34, 7, 6);

        // 2. Four Jointed LEGO Unicorn Legs & Golden Hooves
        c.fillStyle = '#f48fb1';
        c.fillRect(6 + swing * 0.6, 36, 10, 14);
        c.fillRect(30 - swing * 0.6, 36, 10, 14);
        c.fillStyle = '#ffd700'; // Golden hooves!
        c.fillRect(5 + swing * 0.6, 48, 12, 5);
        c.fillRect(29 - swing * 0.6, 48, 12, 5);

        // 3. Studded White & Pink LEGO Unicorn Body Brick
        drawStuddedLegoBrick(c, 4, 20, 38, 18, LEGO_COLORS[7]);
        // Royal Purple Saddle Brick on back
        drawStuddedLegoBrick(c, 12, 16, 18, 7, LEGO_COLORS[1]);

        // 4. Fluttering Lavender Pegasus Wing
        c.fillStyle = '#ea80fc';
        c.beginPath();
        c.moveTo(16, 22);
        c.lineTo(6, 10 + wingFlap);
        c.lineTo(24, 14 + wingFlap * 0.5);
        c.closePath();
        c.fill();
        c.strokeStyle = '#ffffff';
        c.lineWidth = 1.4;
        c.stroke();

        // 5. Cute LEGO Unicorn Head & Snout Brick
        drawStuddedLegoBrick(c, 24, 4, 22, 18, LEGO_COLORS[7]);
        // Pink Snout & Smile
        c.fillStyle = '#fce4ec';
        c.fillRect(38, 9, 10, 12);
        c.strokeStyle = '#ec407a';
        c.strokeRect(38, 9, 10, 12);

        // Sparkly Purple Eye + Rosy Cheek
        c.fillStyle = '#4a148c';
        c.beginPath();
        c.arc(34, 11, 3, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#ffffff';
        c.beginPath();
        c.arc(35, 10, 1.2, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#ff4081';
        c.beginPath();
        c.arc(35, 16, 2.5, 0, Math.PI * 2);
        c.fill();

        // Pink & Purple LEGO Mane Bricks
        c.fillStyle = '#ec407a';
        c.fillRect(20, 5, 5, 15);
        c.fillStyle = '#8e24aa';
        c.fillRect(17, 9, 4, 12);

        // 6. Magical Spiraled Golden LEGO Unicorn Horn & Mini Princess Crown!
        c.fillStyle = '#ffd700';
        c.beginPath();
        c.moveTo(35, 4);
        c.lineTo(48, -11);
        c.lineTo(42, 4);
        c.closePath();
        c.fill();
        c.strokeStyle = '#ff6f00';
        c.lineWidth = 1.4;
        c.stroke();

        // 7. Unicorn Magic Telekinesis Aura holding the active Builder Brick/Tool!
        if (legoState.tool === 'build') {
          const hoverY = Math.sin((ts || performance.now()) * 0.01) * 3;
          c.fillStyle = legoState.selectedColor.hex;
          c.fillRect(46, 14 + hoverY, 14, 9);
          c.strokeStyle = '#ffd700';
          c.lineWidth = 1.5;
          c.strokeRect(46, 14 + hoverY, 14, 9);
        } else if (legoState.tool === 'pry') {
          c.strokeStyle = '#ffd700';
          c.lineWidth = 3;
          c.beginPath();
          c.moveTo(44, 22);
          c.lineTo(54, 12);
          c.stroke();
        }

        c.restore();
      }

      // Main 60fps LEGO Physics & World Render Loop
      function stepLegoMasterWorld(ts) {
        if (currentWorld !== 'lego' || !legoState) return;

        const p = legoState.person;
        const fY = legoState.floorY;

        // 1. Update Launching Rockets & Falling Bricks under LEGO Gravity Law
        let anyLanded = false;
        legoState.bricks.forEach(b => {
          if (b.launching) {
            b.vy = (b.vy || -6) - 0.18;
            b.y += b.vy;
            if (Math.random() < 0.5) {
              legoState.spawnFlyingDebris(b.x + b.w / 2, b.y + b.h, '#ff4081', 1);
            }
            if (b.y < -80) {
              b.y = fY - 180;
              b.launching = false;
              b.falling = true;
              b.vy = 0;
            }
            return;
          }

          if (b.falling) {
            b.vy = (b.vy || 0) + 0.62;
            b.y += b.vy;

            const overSolidGround = (() => {
              const sCol = Math.round(b.x / LEGO_STUD_W);
              const eCol = Math.round((b.x + b.w) / LEGO_STUD_W);
              for (let c = sCol; c < eCol; c++) {
                if (!isRiverStud(c)) return true;
              }
              return false;
            })();

            if (overSolidGround && b.y + b.h >= fY) {
              b.y = fY - b.h;
              b.vy = 0;
              b.falling = false;
              anyLanded = true;
            }

            legoState.bricks.forEach(other => {
              if (other === b || other.falling || other.launching) return;
              if (bricksOverlapX(b, other) && b.y + b.h >= other.y && b.y + b.h - b.vy <= other.y + 8) {
                b.y = other.y - b.h;
                b.vy = 0;
                b.falling = false;
                anyLanded = true;
              }
            });

            if (b.y > fCanvas.height + 40) {
              b.removeMe = true;
            }
          }
        });
        legoState.bricks = legoState.bricks.filter(b => !b.removeMe);
        if (anyLanded) {
          playMagicSound('legoSnap');
          runLegoStructuralPhysics();
        }

        // 2. Update Cute LEGO Unicorn Movement & Auto-Stair Climbing Physics
        if (legoState.keys.left) {
          p.vx = -4.2;
          p.facing = -1;
        } else if (legoState.keys.right) {
          p.vx = 4.2;
          p.facing = 1;
        } else if (p.targetWalkX !== null) {
          const diff = p.targetWalkX - p.x;
          if (Math.abs(diff) > 10) {
            p.vx = Math.sign(diff) * 3.8;
            p.facing = Math.sign(diff) || 1;
          } else {
            p.vx = 0;
            p.targetWalkX = null;
          }
        } else {
          p.vx *= 0.75;
        }

        if (Math.abs(p.vx) > 0.3 && p.onGround) {
          p.walkPhase += 0.3;
        }
        if (p.armSwing > 0) {
          p.armSwing = Math.max(0, p.armSwing - 0.08);
        }

        const nextX = Math.max(12, Math.min(LEGO_WORLD_W - p.w - 12, p.x + p.vx));
        const wallBrick = legoState.bricks.find(b =>
          !b.falling && !b.launching &&
          nextX + p.w > b.x + 2 && nextX < b.x + b.w - 2 &&
          p.y + p.h > b.y + 4 && p.y < b.y + b.h - 4
        );
        if (wallBrick) {
          const stepHeight = (p.y + p.h) - wallBrick.y;
          if (stepHeight <= LEGO_BRICK_H + 6 && p.onGround) {
            p.y = wallBrick.y - p.h;
            p.x = nextX;
          }
        } else {
          p.x = nextX;
        }

        // Vertical Gravity & Brick Top Landing for the Cute LEGO Unicorn
        const prevFootY = p.y + p.h;
        p.vy += 0.5;
        p.y += p.vy;
        p.onGround = false;

        for (let i = 0; i < legoState.bricks.length; i++) {
          const b = legoState.bricks[i];
          if (b.falling) continue;
          if (
            p.x + p.w > b.x + 3 && p.x < b.x + b.w - 3 &&
            prevFootY <= b.y + 12 && p.y + p.h >= b.y && p.vy >= 0
          ) {
            p.y = b.y - p.h;
            p.vy = 0;
            p.onGround = true;
            if (b.shape === 'spring') {
              p.vy = -14.5;
              p.onGround = false;
              playMagicSound('legoSpring');
            }
          }
        }

        const pCol = Math.floor((p.x + p.w / 2) / LEGO_STUD_W);
        if (!isRiverStud(pCol)) {
          if (p.y + p.h >= fY) {
            p.y = fY - p.h;
            p.vy = 0;
            p.onGround = true;
          }
        } else {
          if (p.y + p.h >= fY + 14) {
            p.vy = -9.0;
            p.x = 180;
            p.targetWalkX = null;
            playMagicSound('oops');
          }
        }

        // 3. Check Golden LEGO Crown Pickups
        legoState.trophies.forEach(tr => {
          if (!tr.collected) {
            const dx = (p.x + p.w / 2) - tr.x;
            const dy = (p.y + p.h / 2) - tr.y;
            if (dx * dx + dy * dy < 42 * 42) {
              tr.collected = true;
              addStar();
              playMagicSound('legoStud');
              setTimeout(() => playMagicSound('success'), 120);
              legoState.spawnFlyingDebris(tr.x, tr.y, '#ffd700', 20);
            }
          }
        });

        // 4. Smooth Camera Follow
        const targetCam = Math.max(0, Math.min(LEGO_WORLD_W - fCanvas.width, p.x - fCanvas.width * 0.35));
        legoState.camX += (targetCam - legoState.camX) * 0.14;

        // 5. RENDER FULL-SCREEN PINK & PURPLE LEGO UNICORN KINGDOM
        fCtx.clearRect(0, 0, fCanvas.width, fCanvas.height);

        const skyGrad = fCtx.createLinearGradient(0, 0, 0, fY);
        if (legoState.skyMode === 1) {
          // Royal Sunset
          skyGrad.addColorStop(0, '#4a148c');
          skyGrad.addColorStop(0.55, '#ec407a');
          skyGrad.addColorStop(1, '#ffe082');
        } else if (legoState.skyMode === 2) {
          // Starry Night
          skyGrad.addColorStop(0, '#1a0033');
          skyGrad.addColorStop(0.6, '#311b92');
          skyGrad.addColorStop(1, '#6a1b9a');
        } else {
          // Pink & Lavender Unicorn Day
          skyGrad.addColorStop(0, '#f48fb1');
          skyGrad.addColorStop(0.6, '#f8bbd0');
          skyGrad.addColorStop(1, '#f3e5f5');
        }
        fCtx.fillStyle = skyGrad;
        fCtx.fillRect(0, 0, fCanvas.width, fCanvas.height);

        fCtx.save();
        fCtx.translate(-legoState.camX, 0);

        // Parallax Pastel Purple LEGO Mountains & Distant Castles
        for (let m = 0; m < 16; m++) {
          const mx = m * 240;
          const mh = 65 + (m % 3) * 28;
          if (mx + 180 > legoState.camX && mx < legoState.camX + fCanvas.width) {
            fCtx.fillStyle = legoState.skyMode === 2 ? 'rgba(74, 20, 140, 0.55)' : 'rgba(206, 147, 216, 0.45)';
            fCtx.beginPath();
            fCtx.moveTo(mx, fY);
            fCtx.lineTo(mx + 90, fY - mh);
            fCtx.lineTo(mx + 180, fY);
            fCtx.closePath();
            fCtx.fill();
          }
        }

        // Subtle Stud Grid Guide Lines in the Sky
        fCtx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        fCtx.lineWidth = 1;
        const startGridX = Math.floor(legoState.camX / LEGO_STUD_W) * LEGO_STUD_W;
        for (let gx = startGridX; gx < legoState.camX + fCanvas.width; gx += LEGO_STUD_W) {
          fCtx.beginPath();
          fCtx.moveTo(gx, 0);
          fCtx.lineTo(gx, fY);
          fCtx.stroke();
        }
        for (let gy = fY; gy > 0; gy -= LEGO_BRICK_H) {
          fCtx.beginPath();
          fCtx.moveTo(startGridX, gy);
          fCtx.lineTo(legoState.camX + fCanvas.width, gy);
          fCtx.stroke();
        }

        // Parallax Pink & White LEGO Clouds
        for (let i = 0; i < 18; i++) {
          const cx = i * 210 + 48;
          if (cx + 96 > legoState.camX && cx < legoState.camX + fCanvas.width) {
            drawLegoShape(fCtx, {
              x: cx,
              y: 68 + (i % 3) * 22,
              w: 72,
              h: 20,
              shape: '2x4',
              colorObj: i % 2 === 0 ? LEGO_COLORS[7] : LEGO_COLORS[2]
            }, false, true, ts);
          }
        }

        // Ground Royal Lavender Studded LEGO Baseplate + Sparkling Aqua River
        const firstCol = Math.max(0, Math.floor(legoState.camX / (LEGO_STUD_W * 4)) * 4);
        const lastCol = Math.min(LEGO_WORLD_COLS, Math.ceil((legoState.camX + fCanvas.width) / (LEGO_STUD_W * 4)) * 4);
        for (let col = firstCol; col < lastCol; col += 2) {
          const bx = col * LEGO_STUD_W;
          const river = isRiverStud(col);
          drawLegoShape(fCtx, {
            x: bx,
            y: river ? fY + 10 : fY,
            w: LEGO_STUD_W * 2,
            h: fCanvas.height - fY + 10,
            shape: '2x2',
            colorObj: river ? LEGO_COLORS[5] : LEGO_COLORS[3]
          }, false, true, ts);
        }

        // Draw Blueprint Ghost Guides
        legoState.blueprints.forEach(bp => {
          if (!bp.filled && bp.x + bp.w > legoState.camX && bp.x < legoState.camX + fCanvas.width) {
            drawLegoShape(fCtx, bp, true, true, ts);
          }
        });

        // Draw All Placed & Physics-Active LEGO Bricks
        legoState.bricks.forEach(b => {
          if (b.x + b.w > legoState.camX - 24 && b.x < legoState.camX + fCanvas.width + 24) {
            drawLegoShape(fCtx, b, false, true, ts);
          }
        });

        // Draw Live Snap Preview Ghost Brick
        if (legoState.ghost.active && (legoState.tool === 'build' || legoState.grabbedBrick)) {
          drawLegoShape(fCtx, legoState.ghost, true, legoState.ghost.valid, ts);
        }

        // Draw Floating Golden LEGO Trophy Crowns
        legoState.trophies.forEach(tr => {
          if (!tr.collected && tr.x > legoState.camX - 40 && tr.x < legoState.camX + fCanvas.width + 40) {
            const bob = Math.sin(ts * 0.005) * 5;
            drawLegoShape(fCtx, {
              x: tr.x - 24,
              y: tr.y + bob,
              w: 48,
              h: 28,
              shape: 'crown',
              colorObj: LEGO_COLORS[4]
            }, false, true, ts);
          }
        });

        // Draw Cute Articulated LEGO Unicorn Builder Character!
        drawCuteLegoUnicornBuilder(fCtx, p, ts);

        // Draw Flying LEGO Debris Particles
        for (let i = legoState.debris.length - 1; i >= 0; i--) {
          const d = legoState.debris[i];
          d.x += d.vx;
          d.y += d.vy;
          d.vy += 0.35;
          d.alpha -= 0.03;
          if (d.alpha <= 0) {
            legoState.debris.splice(i, 1);
            continue;
          }
          fCtx.save();
          fCtx.globalAlpha = d.alpha;
          fCtx.fillStyle = d.color;
          fCtx.fillRect(d.x, d.y, 12, 8);
          fCtx.strokeStyle = '#4a148c';
          fCtx.strokeRect(d.x, d.y, 12, 8);
          fCtx.restore();
        }

        fCtx.restore();

        legoLoopId = requestAnimationFrame(stepLegoMasterWorld);
      }

      runLegoStructuralPhysics();
      legoLoopId = requestAnimationFrame(stepLegoMasterWorld);
      playMagicSound('legoSnap');
    }

    function startLegoScroller() {
      startLegoWorld();
    }

    /*************************************************************************
     * WORLD 10: 🕶️ HERE COME THE GRANNIES! (Dress Up Closet)
     *************************************************************************/
    function startClosetWorld() {
      document.getElementById('speech-text').textContent = "🕶️ Tap any unlocked accessory to dress me up!";

      const showcase = document.getElementById('showcase-card');
      showcase.innerHTML = `
        <div style="font-size:1.15rem; font-weight:700; color:#2b4c7e;">
          🕶️ Here Come The Grannies Closet — 💵⭐ ${stars} Dollarbuck Stars!
        </div>
        <div style="font-size:0.92rem; color:#d95f02; font-weight:700;">
          Unlock Granny Glasses, Featherwand, Chattermax &amp; Unicorse!
        </div>
      `;

      const area = document.getElementById('interactive-area');
      area.innerHTML = `<div class="closet-grid" id="closet-grid"></div>`;
      const grid = document.getElementById('closet-grid');

      ROYAL_CLOSET.forEach(item => {
        const unlocked = stars >= item.stars;
        const card = document.createElement('div');
        card.className = `closet-card ${item.equipped ? 'equipped' : ''} ${!unlocked ? 'locked' : ''}`;
        card.innerHTML = `
          <div style="font-size:2.4rem;">${item.emoji}</div>
          <div style="font-weight:700; color:#2b4c7e; font-size:0.95rem;">${item.name}</div>
          <div style="font-size:0.85rem; font-weight:700; color:#d95f02; margin-top:3px;">
            ${unlocked ? (item.equipped ? '✅ Wearing!' : '✨ Wear!') : `🔒 ⭐ ${item.stars}`}
          </div>
        `;
        card.onclick = () => {
          if (!unlocked) {
            playMagicSound('oops');
            document.getElementById('speech-text').textContent = `🔒 Need ${item.stars} ⭐ Dollarbuck Stars for ${item.name}!`;
            return;
          }
          const wasEquipped = item.equipped;
          ROYAL_CLOSET.filter(i => i.slot === item.slot).forEach(i => i.equipped = false);
          item.equipped = !wasEquipped;

          const slotEl = document.getElementById(item.slot);
          if (item.equipped) {
            slotEl.textContent = item.emoji;
            slotEl.style.display = 'block';
            playMagicSound('success');
            burstSparkles(window.innerWidth / 2, 180, 35);
            document.getElementById('speech-text').textContent = `✨ Wearing ${item.emoji} ${item.name}!`;
          } else {
            slotEl.style.display = 'none';
            playMagicSound('pop');
            document.getElementById('speech-text').textContent = `Took off ${item.name}!`;
          }
          startClosetWorld();
        };
        grid.appendChild(card);
      });
    }

    /*************************************************************************
     * 5. SPARKLE & STAR PARTICLE ENGINE
     *************************************************************************/
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function burstSparkles(x, y, count = 40) {
      const colors = ['#ff4081', '#ec407a', '#ab47bc', '#ea80fc', '#ffd700', '#f48fb1'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8.5 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.5,
          size: Math.random() * 10 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          rotation: Math.random() * 360
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.22;
        p.alpha -= 0.018;
        p.rotation += 6;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        for (let s = 0; s < 4; s++) {
          ctx.lineTo(0, -p.size);
          ctx.rotate(Math.PI / 4);
          ctx.lineTo(0, -p.size * 0.4);
          ctx.rotate(Math.PI / 4);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    window.addEventListener('DOMContentLoaded', () => {
      setWorld('abc');
    });
  </script>
</body>
