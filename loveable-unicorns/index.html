<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ec407a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>v4.0 | Loveable Unicorns 🦄💖 Royal Pink &amp; Purple Kindergarten!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Royal Pinky & Purple Unicorn Palace Palette */
      --bluey-dark: #4a148c;
      --bluey-main: #d81b60;
      --bluey-light: #f48fb1;
      --bingo-orange: #ab47bc;
      --bingo-cream: #fce4ec;
      --pink-hot: #ff1493;
      --pink-main: #ec407a;
      --purple-dark: #311b92;
      --gold: #ffd700;
      --sky-1: #f8bbd0;
      --sky-2: #f3e5f5;
      --sky-3: #e1bee7;
      --font-print: 'Andika', 'Fredoka', Roboto, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      --font-ui: 'Fredoka', 'Andika', Roboto, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    /* =========================================================================
       1. MOBILE FIRST BASE STYLES (Phone portrait: Pixel 8 / iPhone)
       ========================================================================= */
    body {
      font-family: var(--font-ui);
      background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--bluey-dark);
      padding: 6px 8px 18px;
    }

    .rainbow-bg {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 110vw;
      max-width: 860px;
      height: 300px;
      border-radius: 450px 450px 0 0;
      box-shadow:
        0 -12px 0 0 rgba(255, 94, 158, 0.24),
        0 -24px 0 0 rgba(245, 134, 52, 0.24),
        0 -36px 0 0 rgba(255, 215, 64, 0.24),
        0 -48px 0 0 rgba(102, 187, 106, 0.24),
        0 -60px 0 0 rgba(79, 145, 205, 0.24),
        0 -72px 0 0 rgba(171, 71, 188, 0.24);
      pointer-events: none;
      z-index: 0;
    }

    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      font-size: 2.6rem;
      opacity: 0.6;
      animation: floatCloud linear infinite;
    }

    @keyframes floatCloud {
      from { transform: translateX(-120px); }
      to { transform: translateX(calc(100vw + 120px)); }
    }

    /* Compact Mobile Top Bar */
    .game-header {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 980px;
      padding: 2px 2px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
    }

    .brand-pill {
      background: linear-gradient(135deg, #ffffff, #fce4ec);
      border: 3px solid var(--bluey-main);
      border-radius: 999px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 0 var(--bluey-main);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--bluey-dark);
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .star-pill {
      background: linear-gradient(135deg, #fff9c4, #ffd54f);
      border: 3px solid #f57c00;
      border-radius: 999px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #8d4e00;
      box-shadow: 0 3px 0 #f57c00;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }

    .star-pill.pop {
      transform: scale(1.25) rotate(5deg);
    }

    .ctrl-btn {
      background: #ffffff;
      border: 3px solid var(--bluey-main);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: var(--font-ui);
      color: var(--bluey-dark);
      cursor: pointer;
      box-shadow: 0 3px 0 var(--bluey-main);
      white-space: nowrap;
    }

    .ctrl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--bluey-main);
    }

    /* Mobile-First 5x2 Compact World Selector Grid (10 Worlds!) */
    .world-nav {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 6px;
    }

    .world-btn {
      border: 2.5px solid #ffffff;
      border-radius: 14px;
      padding: 5px 2px;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: var(--font-ui);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
      line-height: 1.1;
    }

    .world-btn .w-icon {
      font-size: 1.18rem;
    }

    .world-btn.active {
      outline: 3px solid #ffd700;
      transform: translateY(-1px);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25), 0 0 12px rgba(255, 215, 0, 0.9);
    }

    .w-abc     { background: linear-gradient(135deg, #ec407a, #ad1457); }
    .w-blend   { background: linear-gradient(135deg, #ab47bc, #6a1b9a); }
    .w-math    { background: linear-gradient(135deg, #f06292, #c2185b); }
    .w-days    { background: linear-gradient(135deg, #ba68c8, #7b1fa2); }
    .w-seasons { background: linear-gradient(135deg, #ff80ab, #d81b60); }
    .w-shapes  { background: linear-gradient(135deg, #ce93d8, #8e24aa); }
    .w-lego    { background: linear-gradient(135deg, #ff4081, #7c4dff); color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.35); }
    .w-balloon { background: linear-gradient(135deg, #f48fb1, #ad1457); }
    .w-candy   { background: linear-gradient(135deg, #ea80fc, #6a1b9a); }
    .w-closet  { background: linear-gradient(135deg, #ffd54f, #ec407a); color: #4a148c; }

    /* Royal Pink & Purple Episode Banner ("This episode is called...") */
    .episode-banner {
      background: linear-gradient(90deg, #ad1457, #ec407a, #8e24aa);
      color: #ffffff;
      border: 2.5px solid #ffffff;
      border-radius: 999px;
      padding: 3px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      box-shadow: 0 3px 0 rgba(74, 20, 140, 0.28);
      text-align: center;
    }

    /* Main Stage Card (Mobile First) */
    main {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 960px;
      background: rgba(255, 245, 252, 0.95);
      backdrop-filter: blur(8px);
      border: 4px solid #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 28px rgba(136, 14, 79, 0.22);
      padding: 9px 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Compact Unicorn + Speech Row for Phone Screens */
    .unicorn-header-stage {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-bottom: 8px;
    }

    .unicorn-avatar-box {
      position: relative;
      width: 82px;
      height: 82px;
      background: radial-gradient(circle, #ffffff 35%, #f8bbd0 100%);
      border: 3.5px solid var(--bluey-main);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.35);
      cursor: pointer;
      flex-shrink: 0;
    }

    .unicorn-avatar-box svg {
      width: 72px;
      height: 72px;
    }

    .unicorn-avatar-box.dancing {
      animation: sparkleDance 0.55s ease infinite alternate;
    }

    @keyframes sparkleDance {
      0% { transform: translateY(0) rotate(-6deg) scale(1.04); }
      100% { transform: translateY(-8px) rotate(7deg) scale(1.08); }
    }

    #unicorn-mouth-open {
      opacity: 0;
      transition: opacity 0.08s;
    }
    .speaking #unicorn-mouth-open {
      opacity: 1;
      animation: talkMouth 0.22s infinite alternate;
    }
    .speaking #unicorn-horn {
      filter: drop-shadow(0 0 8px #ffd700);
    }

    @keyframes talkMouth {
      0% { transform: scaleY(0.4); transform-origin: 85px 65px; }
      100% { transform: scaleY(1.15); transform-origin: 85px 65px; }
    }

    .acc-badge {
      position: absolute;
      font-size: 1.4rem;
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
    }
    .acc-crown { top: -12px; left: 50%; transform: translateX(-50%); }
    .acc-wand  { bottom: 0; right: -8px; transform: rotate(15deg); }
    .acc-pet   { bottom: -5px; left: -8px; }
    .acc-wings { top: 15px; left: -11px; font-size: 1.3rem; }

    /* Speech Bubble */
    .speech-card {
      flex: 1;
      min-width: 0;
      background: linear-gradient(135deg, #ffffff, #fce4ec);
      border: 3px solid var(--bingo-orange);
      border-radius: 18px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 4px 0 #e1bee7;
    }

    .speech-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .unicorn-tag {
      display: inline-block;
      background: linear-gradient(90deg, #ec407a, #8e24aa);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      letter-spacing: 0.3px;
    }

    .speech-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .action-circle-btn {
      background: linear-gradient(135deg, #ec407a, #ad1457);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 99px;
      height: 30px;
      min-width: 30px;
      padding: 0 8px;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 3px 0 #880e4f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ui);
      font-weight: 700;
    }

    .action-circle-btn.phonics-btn {
      background: linear-gradient(135deg, #ab47bc, #4a148c);
      box-shadow: 0 3px 0 #311b92;
      font-size: 0.74rem;
      gap: 3px;
    }

    .action-circle-btn:active {
      transform: translateY(2px);
    }

    .speech-text {
      font-family: var(--font-print);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--bluey-dark);
      line-height: 1.25;
    }

    /* Sub-mode pill bar */
    .submode-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      width: 100%;
    }

    .submode-pill {
      background: #fce4ec;
      border: 2.5px solid #f48fb1;
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: var(--font-ui);
      color: var(--bluey-dark);
      cursor: pointer;
    }

    .submode-pill.active {
      background: linear-gradient(135deg, #ec407a, #8e24aa);
      border-color: #ad1457;
      color: #ffffff;
      box-shadow: 0 3px 0 #6a1b9a;
    }

    /* Showcase Stage (Mobile First) */
    .showcase-card {
      background: linear-gradient(180deg, #fff5fa 0%, #f3e5f5 100%);
      border: 3px dashed var(--bluey-main);
      border-radius: 20px;
      padding: 9px 12px;
      margin-bottom: 10px;
      width: 100%;
      min-height: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    .big-prompt-display {
      font-family: var(--font-print);
      font-size: 2.05rem;
      font-weight: 700;
      color: var(--bluey-dark);
      text-shadow: 2px 2px 0 #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      line-height: 1.15;
    }

    .phonics-pill {
      background: #fff9c4;
      border: 2.5px solid #fbc02d;
      border-radius: 16px;
      padding: 4px 12px;
      font-family: var(--font-print);
      font-size: 0.92rem;
      color: #8d4e00;
      cursor: pointer;
      box-shadow: 0 3px 0 #fbc02d;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Sound-It-Out Word Blender Tiles */
    .blender-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin: 4px 0;
    }

    .letter-tile {
      width: 66px;
      height: 76px;
      background: linear-gradient(180deg, #ffffff, #fce4ec);
      border: 4px solid var(--bluey-main);
      border-radius: 18px;
      font-family: var(--font-print);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--bluey-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--bluey-dark);
    }

    .letter-tile.sounded {
      background: linear-gradient(180deg, #fff9c4, #ffe082);
      border-color: var(--bingo-orange);
      box-shadow: 0 5px 0 #6a1b9a;
      transform: translateY(-4px) scale(1.05);
    }

    .tile-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f48fb1;
      margin-top: 2px;
    }

    .letter-tile.sounded .tile-dot {
      background: var(--bingo-orange);
    }

    .blend-arrow-btn {
      background: linear-gradient(135deg, #ec407a, #8e24aa);
      color: #fff;
      border: 3px solid #fff;
      border-radius: 99px;
      padding: 6px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: var(--font-ui);
      cursor: pointer;
      box-shadow: 0 4px 0 #4a148c;
    }

    /* Mobile-First 2x2 Answer Choices Grid */
    .choices-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .choice-btn {
      background: linear-gradient(180deg, #ffffff 0%, #fff0f6 100%);
      border: 4px solid var(--bluey-main);
      border-radius: 22px;
      padding: 12px 8px;
      min-height: 90px;
      font-size: 2.1rem;
      font-weight: 700;
      font-family: var(--font-print);
      color: var(--bluey-dark);
      cursor: pointer;
      box-shadow: 0 6px 0 #880e4f, 0 8px 14px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.12s, background 0.2s;
    }

    .choice-btn .choice-label {
      font-family: var(--font-print);
      font-size: 1.02rem;
      color: #ad1457;
      font-weight: 700;
    }

    .choice-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #880e4f;
    }

    .choice-btn.correct {
      background: linear-gradient(180deg, #b9f6ca, #69f0ae);
      border-color: #00c853;
      color: #1b5e20;
      box-shadow: 0 6px 0 #00c853;
      animation: correctPop 0.55s ease;
    }

    .choice-btn.wrong {
      background: #fff3e0;
      opacity: 0.65;
      animation: gentleShake 0.4s ease;
    }

    @keyframes correctPop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12) rotate(2deg); }
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Counting & Math Objects */
    .counting-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 4px;
    }

    .count-card {
      font-size: 2.1rem;
      width: 56px;
      height: 56px;
      background: #fff;
      border: 3px solid var(--bluey-main);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 0 var(--bluey-main);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .count-card.counted {
      background: #fff9c4;
      border-color: var(--bingo-orange);
      box-shadow: 0 4px 0 var(--bingo-orange);
      transform: scale(1.1);
    }

    .count-num-badge {
      position: absolute;
      bottom: -7px;
      right: -7px;
      background: var(--bingo-orange);
      color: #fff;
      font-family: var(--font-print);
      font-size: 0.85rem;
      font-weight: 700;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Days of the Week Rainbow Train */
    .days-train {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }

    .day-car {
      padding: 6px 4px;
      border-radius: 14px;
      border: 2.5px solid #fff;
      color: #fff;
      font-family: var(--font-print);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .day-car.mystery {
      background: #ffffff !important;
      color: #d81b60 !important;
      border: 3px dashed #ff4081;
      animation: pulseMystery 1s infinite alternate;
    }

    @keyframes pulseMystery {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    /* =========================================================================
       MINI GAME 1: 🎈 KEEPY UPPY! (Balloon Pop)
       ========================================================================= */
    .balloon-arena {
      position: relative;
      width: 100%;
      height: 300px;
      background: linear-gradient(180deg, #f8bbd0 0%, #f3e5f5 65%, #e1bee7 100%);
      border: 4px solid #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: inset 0 6px 20px rgba(136, 14, 79, 0.12);
      touch-action: manipulation;
    }

    .balloon-node {
      position: absolute;
      width: 78px;
      height: 94px;
      border-radius: 50% 50% 48% 48%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-print);
      font-size: 1.9rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      cursor: pointer;
      box-shadow: inset -8px -8px 16px rgba(0,0,0,0.18), inset 8px 8px 16px rgba(255,255,255,0.45), 0 6px 14px rgba(0,0,0,0.12);
      transition: transform 0.1s;
      user-select: none;
    }

    .balloon-node::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      width: 2px;
      height: 18px;
      background: rgba(255,255,255,0.85);
      transform: translateX(-50%);
    }

    .balloon-node:active {
      transform: scale(1.2);
    }

    /* =========================================================================
       MINI GAME 2: 🍬 DUCK CAKE & CANDY CRUSH
       ========================================================================= */
    .candy-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #fce4ec, #f3e5f5);
      border: 4px solid var(--bluey-main);
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 8px 0 #880e4f;
      touch-action: manipulation;
    }

    .candy-cell {
      aspect-ratio: 1 / 1;
      background: linear-gradient(180deg, #ffffff, #fff0f6);
      border: 3.5px solid #f48fb1;
      border-radius: 18px;
      font-size: 2.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #ec407a;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s, border-color 0.15s;
    }

    .candy-cell.selected {
      background: #fff9c4;
      border-color: var(--bingo-orange);
      box-shadow: 0 0 14px var(--bingo-orange);
      transform: scale(1.12);
      z-index: 2;
    }

    .candy-cell.crushing {
      animation: candyCrushAnim 0.35s ease forwards;
    }

    @keyframes candyCrushAnim {
      0% { transform: scale(1.25) rotate(12deg); opacity: 1; background: #fff59d; }
      100% { transform: scale(0.1) rotate(-25deg); opacity: 0; }
    }

    /* Explore / Soundboard Grid */
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }

    .explore-key {
      background: #fff;
      border: 3px solid #f48fb1;
      border-radius: 16px;
      padding: 8px 4px;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: var(--font-print);
      color: var(--bluey-dark);
      cursor: pointer;
      box-shadow: 0 4px 0 var(--bluey-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    /* Royal Closet Grid */
    .closet-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    /* =========================================================================
       MINI GAME 3: 🧱 AAA FULL-SCREEN LEGO WORLD BUILDER, UNICORN & PHYSICS (v4.0)
       ========================================================================= */
    .lego-fs-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #2a0845;
      z-index: 950;
      display: none;
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .lego-fs-overlay.open {
      display: flex;
    }

    .lego-fs-canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: #f8bbd0;
    }

    .lego-fs-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    /* Floating Glassmorphic Top HUD Inside the Map (Pink & Purple Royal Theme) */
    .lego-fs-topbar {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 10px;
      background: linear-gradient(90deg, rgba(136, 14, 79, 0.9), rgba(74, 20, 140, 0.9));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2.5px solid #ff80ab;
      border-radius: 16px;
      color: #ffffff;
      z-index: 12;
      box-shadow: 0 6px 20px rgba(74, 20, 140, 0.45);
      flex-wrap: wrap;
    }

    .lego-fs-title {
      font-family: var(--font-ui);
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fce4ec;
    }

    .lego-fs-btn {
      background: linear-gradient(180deg, #ffffff, #f8bbd0);
      border: 2px solid #ff4081;
      border-radius: 999px;
      padding: 4px 10px;
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 700;
      color: #880e4f;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(74, 20, 140, 0.35);
      white-space: nowrap;
      transition: transform 0.1s;
    }

    .lego-fs-btn:active {
      transform: translateY(2px);
    }

    /* Floating Zone & Spawner Pill Bar under Top HUD */
    .lego-zone-bar {
      position: absolute;
      top: 54px;
      left: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 11;
      padding-bottom: 2px;
    }
    .lego-zone-bar::-webkit-scrollbar {
      display: none;
    }

    .lego-zone-pill {
      background: rgba(74, 20, 140, 0.85);
      backdrop-filter: blur(6px);
      border: 2px solid #f48fb1;
      border-radius: 999px;
      padding: 4px 10px;
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.28);
    }

    .lego-zone-pill.active {
      background: linear-gradient(180deg, #ff4081, #c2185b);
      border-color: #ffee58;
      color: #ffffff;
      transform: scale(1.05);
    }

    .lego-zone-pill.spawner {
      background: linear-gradient(180deg, #ab47bc, #6a1b9a);
      border-color: #ffd54f;
    }

    /* Floating On-Screen Thumb D-Pad Inside the Map (Bigger & Kid-Friendly!) */
    .lego-floating-dpad {
      position: absolute;
      right: 12px;
      bottom: 148px;
      display: flex;
      align-items: flex-end;
      gap: 7px;
      z-index: 12;
      pointer-events: auto;
    }

    .lego-dpad-btn {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      border: 3px solid #ffffff;
      background: linear-gradient(180deg, rgba(171, 71, 188, 0.94), rgba(106, 27, 154, 0.96));
      color: #ffffff;
      font-family: var(--font-ui);
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(49, 27, 146, 0.85), 0 6px 14px rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
    }

    .lego-dpad-btn.jump {
      width: 62px;
      height: 60px;
      background: linear-gradient(180deg, rgba(255, 64, 129, 0.96), rgba(194, 24, 91, 0.98));
      border-color: #ffee58;
      font-size: 0.82rem;
    }

    .lego-dpad-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(49, 27, 146, 0.85);
    }

    /* Floating Glassmorphic Builder Tool & Visual Shape Dock at Bottom of Map */
    .lego-fs-dock {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: calc(6px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, rgba(74, 20, 140, 0.92), rgba(49, 27, 146, 0.95));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2.5px solid #ff80ab;
      border-radius: 20px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 12;
      box-shadow: 0 8px 26px rgba(49, 27, 146, 0.55);
    }

    .lego-dock-row {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 1px;
    }
    .lego-dock-row::-webkit-scrollbar {
      display: none;
    }

    .lego-tool-btn {
      background: rgba(123, 31, 162, 0.92);
      border: 2px solid #f48fb1;
      border-radius: 12px;
      padding: 5px 10px;
      font-family: var(--font-ui);
      font-size: 0.76rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      box-shadow: 0 3px 0 #311b92;
    }

    .lego-tool-btn.active {
      background: linear-gradient(180deg, #ff80ab, #ec407a);
      color: #ffffff;
      border-color: #ffee58;
      box-shadow: 0 3px 0 #880e4f;
      transform: translateY(-1px);
    }

    .lego-cat-btn {
      background: rgba(255, 255, 255, 0.16);
      border: 2px solid rgba(244, 143, 177, 0.65);
      border-radius: 999px;
      padding: 4px 10px;
      font-family: var(--font-ui);
      font-size: 0.74rem;
      font-weight: 700;
      color: #fce4ec;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .lego-cat-btn.active {
      background: linear-gradient(180deg, #ffee58, #fbc02d);
      color: #4a148c;
      border-color: #ffffff;
      box-shadow: 0 2px 0 #c68400;
    }

    .lego-shape-card {
      background: rgba(106, 27, 154, 0.92);
      border: 2px solid #f48fb1;
      border-radius: 13px;
      padding: 4px 9px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
      color: #ffffff;
      font-family: var(--font-ui);
      font-size: 0.76rem;
      font-weight: 700;
      box-shadow: 0 3px 0 #311b92;
    }

    .lego-shape-card.active {
      background: linear-gradient(180deg, #fff59d, #fbc02d);
      color: #880e4f;
      border-color: #ffffff;
      box-shadow: 0 3px 0 #b26a00;
      transform: translateY(-1px);
    }

    .lego-swatch {
      width: 26px;
      height: 26px;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 2px 0 rgba(0,0,0,0.4);
    }

    .lego-swatch.active {
      outline: 3px solid #ffd700;
      transform: scale(1.16);
    }

    .closet-card {
      background: #fff;
      border: 3.5px solid #f48fb1;
      border-radius: 18px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--bluey-main);
      font-family: var(--font-print);
    }

    .closet-card.equipped {
      background: #fff9c4;
      border-color: var(--bingo-orange);
      box-shadow: 0 5px 0 var(--bingo-orange);
    }

    .closet-card.locked {
      opacity: 0.65;
      background: #f5f5f5;
      border-color: #bdbdbd;
      box-shadow: 0 5px 0 #9e9e9e;
    }

    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    /* =========================================================================
       2. TABLET BREAKPOINT (iPad / Android Tablet: 768px and up)
       ========================================================================= */
    @media (min-width: 768px) {
      body { padding: 12px 16px 32px; }
      .brand-pill { font-size: 1.15rem; padding: 7px 16px; }
      .star-pill { font-size: 1.2rem; padding: 6px 16px; }
      .ctrl-btn { font-size: 0.95rem; padding: 7px 14px; }

      .world-nav {
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin-bottom: 10px;
      }

      .world-btn {
        flex-direction: row;
        font-size: 0.95rem;
        padding: 9px 12px;
        border-radius: 18px;
        gap: 6px;
      }

      .episode-banner { font-size: 0.95rem; padding: 5px 20px; margin-bottom: 10px; }

      main {
        padding: 18px 20px 22px;
        border-radius: 32px;
      }

      .unicorn-avatar-box {
        width: 124px;
        height: 124px;
      }
      .unicorn-avatar-box svg {
        width: 104px;
        height: 104px;
      }
      .acc-badge { font-size: 1.95rem; }
      .acc-crown { top: -18px; }

      .speech-card {
        padding: 12px 16px;
        border-radius: 24px;
      }
      .speech-text { font-size: 1.25rem; }
      .action-circle-btn { height: 40px; min-width: 40px; font-size: 1.15rem; }
      .action-circle-btn.phonics-btn { font-size: 0.9rem; padding: 0 14px; }

      .showcase-card { min-height: 118px; padding: 14px 18px; margin-bottom: 14px; }
      .big-prompt-display { font-size: 2.65rem; }

      .choices-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .choice-btn {
        font-size: 2.4rem;
        min-height: 120px;
        padding: 16px 12px;
      }
      .choice-btn .choice-label { font-size: 1.18rem; }

      .balloon-arena { height: 360px; }
      .balloon-node { width: 88px; height: 106px; font-size: 2.2rem; }
      .candy-board { max-width: 440px; gap: 10px; padding: 14px; }
      .candy-cell { font-size: 2.5rem; }

      .count-card { width: 70px; height: 70px; font-size: 2.6rem; }
      .days-train { grid-template-columns: repeat(7, 1fr); }
      .explore-grid { grid-template-columns: repeat(6, 1fr); }
      .closet-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* =========================================================================
       3. DESKTOP / PC BREAKPOINT (1024px and up)
       ========================================================================= */
    @media (min-width: 1024px) {
      .unicorn-avatar-box {
        width: 142px;
        height: 142px;
      }
      .unicorn-avatar-box svg {
        width: 116px;
        height: 116px;
      }
      .speech-text { font-size: 1.35rem; }
      .big-prompt-display { font-size: 2.85rem; }
      .choice-btn:hover { transform: translateY(-3px); }
      .world-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
      .explore-grid { grid-template-columns: repeat(8, 1fr); }
      .closet-grid { grid-template-columns: repeat(5, 1fr); }
    }
  </style>
</head>
<body>

  <div class="rainbow-bg"></div>
  <div class="bg-decor">
    <div class="cloud" style="top: 8%; animation-duration: 42s;">☁️</div>
    <div class="cloud" style="top: 26%; animation-duration: 55s; animation-delay: -22s;">☁️</div>
    <div class="cloud" style="top: 68%; animation-duration: 48s; animation-delay: -12s;">☁️</div>
  </div>

  <canvas id="fx-canvas"></canvas>

  <!-- Compact Mobile-First Game Header -->
  <div class="game-header">
    <div class="brand-pill">
      <span>🦄💖</span>
      <span>Loveable Unicorns <small id="version-badge" style="background:rgba(136,14,79,0.22); padding:1px 6px; border-radius:999px; font-size:0.75em; margin-left:3px;">v4.0</small></span>
    </div>

    <div class="header-controls">
      <div class="star-pill" id="star-box" title="Dollarbucks & Rainbow Stars!">
        <span>💵⭐</span>
        <span id="star-count">0</span>
      </div>
      <button class="ctrl-btn" id="music-btn" onclick="toggleBgMusic()" title="Toggle Background Music!">
        🎵 Music
      </button>
      <button class="ctrl-btn" id="voice-style-btn" onclick="cycleVoiceEnergy()">
        🎀 Girly
      </button>
      <button class="ctrl-btn" id="mute-btn" onclick="toggleMute()">
        🔊 ON
      </button>
    </div>
  </div>

  <!-- 10 Worlds in a Compact 5x2 Grid (Includes LEGO Side-Scroller, Keepy Uppy & Candy Crush!) -->
  <nav class="world-nav">
    <button class="world-btn w-abc active" onclick="setWorld('abc')" id="wbtn-abc">
      <span class="w-icon">🔤</span><span>ABCs</span>
    </button>
    <button class="world-btn w-blend" onclick="setWorld('blend')" id="wbtn-blend">
      <span class="w-icon">📖</span><span>Blend</span>
    </button>
    <button class="world-btn w-math" onclick="setWorld('math')" id="wbtn-math">
      <span class="w-icon">🔢</span><span>123 Math</span>
    </button>
    <button class="world-btn w-days" onclick="setWorld('days')" id="wbtn-days">
      <span class="w-icon">📅</span><span>7 Days</span>
    </button>
    <button class="world-btn w-seasons" onclick="setWorld('seasons')" id="wbtn-seasons">
      <span class="w-icon">🍂</span><span>Seasons</span>
    </button>
    <button class="world-btn w-shapes" onclick="setWorld('shapes')" id="wbtn-shapes">
      <span class="w-icon">🎨</span><span>Shapes</span>
    </button>
    <button class="world-btn w-lego" onclick="setWorld('lego')" id="wbtn-lego">
      <span class="w-icon">🧱</span><span>LEGO World</span>
    </button>
    <button class="world-btn w-balloon" onclick="setWorld('balloon')" id="wbtn-balloon">
      <span class="w-icon">🎈</span><span>Keepy Uppy</span>
    </button>
    <button class="world-btn w-candy" onclick="setWorld('candy')" id="wbtn-candy">
      <span class="w-icon">🎂</span><span>Candy Crush</span>
    </button>
    <button class="world-btn w-closet" onclick="setWorld('closet')" id="wbtn-closet">
      <span class="w-icon">🕶️</span><span>Grannies</span>
    </button>
  </nav>

  <!-- Main Interactive Stage -->
  <main>
    <!-- Bluey Episode Title Card Banner -->
    <div class="episode-banner" id="episode-banner">
      🎬 This episode of Loveable Unicorns is called: Magic Phonics!
    </div>

    <div class="unicorn-header-stage">
      <!-- Animated Talking Princess Unicorn SVG (Pink & Purple Royal Theme) -->
      <div class="unicorn-avatar-box" id="unicorn-box" onclick="petUnicorn()" title="Tap me for silly sayings!">
        <span class="acc-badge acc-wings" id="acc-wings" style="display:none;">🪽</span>
        <svg viewBox="0 0 120 120">
          <!-- Pink, Purple & Magenta Flowing Mane -->
          <path d="M32 45 Q14 55 24 72 Q12 82 28 96" fill="none" stroke="#ab47bc" stroke-width="11" stroke-linecap="round"/>
          <path d="M35 50 Q20 60 28 77" fill="none" stroke="#ec407a" stroke-width="8.5" stroke-linecap="round"/>
          <path d="M38 56 Q25 68 32 85" fill="none" stroke="#ff80ab" stroke-width="7" stroke-linecap="round"/>
          <!-- Ear -->
          <polygon points="45,38 38,17 55,30" fill="#ffffff" stroke="#d81b60" stroke-width="3"/>
          <polygon points="45,35 41,22 52,30" fill="#ffb3d9"/>
          <!-- Head & Neck -->
          <path d="M35 98 L42 55 Q40 32 65 32 Q92 32 96 55 Q98 73 78 77 L68 98 Z" fill="#ffffff" stroke="#d81b60" stroke-width="3.5"/>
          <!-- Cute Snout -->
          <ellipse cx="86" cy="59" rx="15" ry="13.5" fill="#fce4ec"/>
          <circle cx="83" cy="54" r="2.2" fill="#4a148c"/>
          <circle cx="93" cy="54" r="2.2" fill="#4a148c"/>
          <!-- Closed Smile -->
          <path d="M78 63 Q85 71 93 63" fill="none" stroke="#4a148c" stroke-width="3" stroke-linecap="round"/>
          <!-- Animated Talking Open Mouth -->
          <ellipse id="unicorn-mouth-open" cx="85.5" cy="65" rx="6.5" ry="5" fill="#ff1493" stroke="#4a148c" stroke-width="2"/>
          <!-- Sparkly Big Eye -->
          <circle cx="62" cy="49" r="7" fill="#4a148c"/>
          <circle cx="60" cy="46.5" r="2.7" fill="#ffffff"/>
          <circle cx="64.5" cy="51.5" r="1.3" fill="#ffffff"/>
          <path d="M55 44 L50 39 M58 42 L55 36 M62 41 L61 36" stroke="#4a148c" stroke-width="2.2" stroke-linecap="round"/>
          <!-- Rosy Blush -->
          <ellipse cx="66" cy="59" rx="6.5" ry="3.8" fill="#ff4081" opacity="0.55"/>
          <!-- Magical Golden Horn -->
          <polygon id="unicorn-horn" points="62,33 80,4 73,37" fill="url(#hornGrad)" stroke="#ffa000" stroke-width="2.2"/>
          <defs>
            <linearGradient id="hornGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffff8d"/>
              <stop offset="50%" stop-color="#ffd740"/>
              <stop offset="100%" stop-color="#ff6f00"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="acc-badge acc-crown" id="acc-crown">👑</span>
        <span class="acc-badge acc-wand" id="acc-wand" style="display:none;">🪶</span>
        <span class="acc-badge acc-pet" id="acc-pet" style="display:none;">🦉</span>
      </div>

      <!-- Speech Bubble + Sound Out Controls -->
      <div class="speech-card">
        <div class="speech-top-row">
          <span class="unicorn-tag">💖 ROYAL PINK &amp; PURPLE UNICORN</span>
          <div class="speech-actions">
            <button class="action-circle-btn phonics-btn" id="sound-out-btn" onclick="soundOutCurrent()" title="Sound It Out Slowly!">
              🗣️ Sound Out
            </button>
            <button class="action-circle-btn" onclick="repeatCurrentPrompt()" title="Say it again!">
              🔊
            </button>
          </div>
        </div>
        <div class="speech-text" id="speech-text" onclick="repeatCurrentPrompt()" style="cursor:pointer;">
          Wackadoo! Ready to play in our Pink &amp; Purple Unicorn Kingdom?! Hooray! 🦄💖💜
        </div>
      </div>
    </div>

    <!-- Optional Sub-mode switcher -->
    <div class="submode-bar" id="submode-bar" style="display:none;"></div>

    <!-- Visual Showcase Area -->
    <div class="showcase-card" id="showcase-card"></div>

    <!-- Interactive Choices Area -->
    <div id="interactive-area" style="width: 100%; display: flex; justify-content: center;"></div>
  </main>

  <!-- AAA FULL-SCREEN LEGO WORLD BUILDER, CUTE UNICORN BUILDER & LEGO PHYSICS ENGINE (v4.0) -->
  <div class="lego-fs-overlay" id="lego-fs-overlay">
    <div class="lego-fs-canvas-wrap" id="lego-fs-canvas-wrap">
      <canvas class="lego-fs-canvas" id="lego-fs-canvas"></canvas>

      <!-- Floating Glassmorphic Top HUD Bar Inside the Map -->
      <div class="lego-fs-topbar">
        <div style="display:flex; align-items:center; gap:6px; min-width:0;">
          <button class="lego-fs-btn" onclick="exitLegoWorld()">🚪 Exit</button>
          <div class="lego-fs-title" id="lego-quest-banner">
            🦄 LEGO Unicorn Builder v4.0: Tap Any Zone or Build!
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:5px; flex-shrink:0;">
          <button class="lego-fs-btn" id="lego-sky-btn" onclick="cycleLegoSkyMode()" title="Change Day, Sunset or Night!">🌸 Pink Sky</button>
          <button class="lego-fs-btn" onclick="launchLegoRockets()" style="background:linear-gradient(180deg,#ff4081,#ad1457); color:#fff; border-color:#ffee58;">🚀 Launch!</button>
          <span style="background:rgba(49,27,146,0.65); padding:3px 8px; border-radius:999px; font-family:var(--font-ui); font-size:0.78rem; font-weight:700; border:1.5px solid #ffd54f;">
            💵⭐ <span id="lego-fs-stars">0</span>
          </span>
          <button class="lego-fs-btn" onclick="toggleBgMusic()">🎵</button>
        </div>
      </div>

      <!-- Kid-Friendly Big Zone Teleporters + 1-Tap Instant Toy Spawners (No Long Scrolling Needed!) -->
      <div class="lego-zone-bar" id="lego-zone-bar">
        <button class="lego-zone-pill active" data-zone="0" onclick="teleportLegoZone(0)">🌉 1. Bridge</button>
        <button class="lego-zone-pill" data-zone="1" onclick="teleportLegoZone(1)">🏡 2. House</button>
        <button class="lego-zone-pill" data-zone="2" onclick="teleportLegoZone(2)">🚀 3. Rockets</button>
        <button class="lego-zone-pill" data-zone="3" onclick="teleportLegoZone(3)">🏰 4. Castle</button>

    function selectBestGirlyVoice() {
      if (!('speechSynthesis' in window)) return;
      const allVoices = window.speechSynthesis.getVoices();
      if (!allVoices.length) return;

      const enVoices = allVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
      if (!enVoices.length) {
        preferredVoice = allVoices[0];
        return;
      }

      const wantAussie = voiceEnergyMode === 1;

      const scored = enVoices.map(v => {
        const id = (v.name + ' ' + v.voiceURI + ' ' + v.lang).toLowerCase();
        let score = 0;

        // Filter out male voices on Android, Windows, iOS
        if (/iom|iol|tpd|gbd|auc|aud|male|david|mark|daniel|alex|fred|guy|christopher|eric|roger|steffan|james|william/.test(id)) {
          score -= 120;
        }

        // Australian female voices (Bluey mode!)
        if (wantAussie && (id.includes('en-au') || id.includes('en_au') || id.includes('karen') || id.includes('catherine') || id.includes('matilda') || id.includes('afh') || id.includes('aua'))) {
          score += 95;
        }

        // Windows / Apple / Chrome female & child voices
        if (id.includes('microsoft ana')) score += 90;
        if (id.includes('microsoft aria') || id.includes('microsoft jenny') || id.includes('natasha')) score += 75;
        if (id.includes('samantha') || id.includes('karen')) score += 78;
        if (id.includes('google us english')) score += 65;

        // Pixel 8 / Android Google TTS female local voice codes
        if (id.includes('tpf')) score += 88;
        if (id.includes('sfg')) score += 84;
        if (id.includes('afh') || id.includes('aua')) score += 82; // Android Aussie female!
        if (id.includes('iob') || id.includes('tpc')) score += 76;
        if (/female|woman|girl|zira/.test(id)) score += 60;

        // Prefer local voices on Android so utter.pitch works!
        if (id.includes('local') || v.localService) score += 28;
        if (id.includes('network')) score -= 18;

        return { voice: v, score, id };
      });

      scored.sort((a, b) => b.score - a.score);
      candidateVoices = scored.filter(s => s.score >= 0).map(s => s.voice);
      if (!candidateVoices.length) candidateVoices = enVoices;

      preferredVoice = candidateVoices[selectedVoiceIndex % candidateVoices.length] || candidateVoices[0];
    }

      window.speechSynthesis.onvoiceschanged = selectBestGirlyVoice;

    function cleanForSpeech(str) {
      return str
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function unicornSpeak(text, options = {}) {
      const { updateBubble = true, isSoundOut = false, customRate = null, customPitch = null } = options;
      if (updateBubble) {
        lastSpokenPrompt = text;
        document.getElementById('speech-text').textContent = text;
      }
      if (soundMuted || !('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      if (!preferredVoice) selectBestGirlyVoice();

      const style = VOICE_STYLES[voiceEnergyMode];
      const ubox = document.getElementById('unicorn-box');

      const rawClean = cleanForSpeech(text);
      const chunks = isSoundOut
        ? rawClean.split('|').map(s => s.trim()).filter(Boolean)
        : [rawClean];

      chunks.forEach((chunk, idx) => {
        const utter = new SpeechSynthesisUtterance(chunk);
        if (preferredVoice) utter.voice = preferredVoice;

        const isExclaim = chunk.includes('!');
        utter.pitch = customPitch || (style.pitch + (isExclaim ? 0.08 : 0));
        utter.rate = customRate || (isSoundOut ? 0.82 : style.rate);

        utter.onstart = () => ubox.classList.add('speaking');
        utter.onend = () => {
          if (idx === chunks.length - 1) ubox.classList.remove('speaking');
        };
        utter.onerror = () => ubox.classList.remove('speaking');

        window.speechSynthesis.speak(utter);
      });
    }

    function repeatCurrentPrompt() {
      playMagicSound('pop');
      unicornSpeak(lastSpokenPrompt, { updateBubble: false });
    }

    function soundOutCurrent() {
      playMagicSound('sparkle');
      if (typeof currentSoundOutCallback === 'function') {
        currentSoundOutCallback();
      } else {
        unicornSpeak(lastSpokenPrompt, { updateBubble: false, customRate: 0.8 });
      }
    }

    function cycleVoiceEnergy() {
      voiceEnergyMode = (voiceEnergyMode + 1) % VOICE_STYLES.length;
      if (voiceEnergyMode === 0 && candidateVoices.length > 1) {
        selectedVoiceIndex = (selectedVoiceIndex + 1) % Math.min(candidateVoices.length, 4);

    /*************************************************************************
     * 3. WEB AUDIO API MAGICAL & BLUEY DANCE CHIMES
     *************************************************************************/
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playMagicSound(type = 'success') {
      if (soundMuted) return;
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        if (type === 'success') {
          // Upbeat Bluey-style "Ba-da-da-da-DA!" celebration riff!
          const notes = [523.25, 659.25, 783.99, 659.25, 1046.5];
          const times = [0, 0.08, 0.16, 0.24, 0.33];
          notes.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + times[i]);
            gain.gain.setValueAtTime(0.24, now + times[i]);
            gain.gain.exponentialRampToValueAtTime(0.001, now + times[i] + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + times[i]);
            osc.stop(now + times[i] + 0.35);
          });
        } else if (type === 'sparkle') {
          const notes = [880, 1174.66, 1396.91, 1760];
          notes.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.05);
            gain.gain.setValueAtTime(0.15, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.25);
          });
        } else if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(980, now + 0.11);
          gain.gain.setValueAtTime(0.26, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === 'oops') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(310, now);
          osc.frequency.linearRampToValueAtTime(220, now + 0.22);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        } else if (type === 'legoSnap') {
          // Crisp plastic LEGO brick click-snap transient
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.045);
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'square';
          osc2.frequency.setValueAtTime(2200, now + 0.025);
          osc2.frequency.exponentialRampToValueAtTime(880, now + 0.065);
          gain2.gain.setValueAtTime(0.2, now + 0.025);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.025);
          osc2.stop(now + 0.07);
        } else if (type === 'legoStud') {
          // Iconic LEGO video game stud pickup metallic chime (B5 -> E6)
          const notes = [987.77, 1318.51];
          notes.forEach((f, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + idx * 0.055);
            gain.gain.setValueAtTime(0.24, now + idx * 0.055);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.26);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.055);
            osc.stop(now + idx * 0.055 + 0.26);
          });
        } else if (type === 'legoBreak') {
          // Clattering plastic LEGO bricks tumbling apart
          const freqs = [920, 680, 1180, 540, 810];
          freqs.forEach((f, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + idx * 0.032);
            osc.frequency.exponentialRampToValueAtTime(f * 0.55, now + idx * 0.032 + 0.045);
            gain.gain.setValueAtTime(0.22, now + idx * 0.032);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.032 + 0.05);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.032);
            osc.stop(now + idx * 0.032 + 0.05);
          });
        } else if (type === 'legoSpring') {
          // Bouncy LEGO springboard boing
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.24);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        }
      } catch (e) {}
    }

    // Xylophone ascending note when poking items to count (no chatty voice spam!)
    function playCountNote(stepNum = 1) {
      if (soundMuted) return;
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5, 1174.66, 1318.51, 1396.91, 1567.98];
        const freq = scale[(Math.max(1, stepNum) - 1) % scale.length];
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.23);
      } catch (e) {}
    }

    // Procedural Upbeat Bluey & LEGO Marimba Background Music Loop
    const BG_MELODY_STEPS = [
      { f: 523.25, b: 196.00 }, // C5
      { f: 659.25, b: 0 },      // E5
      { f: 783.99, b: 261.63 }, // G5
      { f: 659.25, b: 0 },      // E5
      { f: 880.00, b: 220.00 }, // A5
      { f: 783.99, b: 0 },      // G5
      { f: 659.25, b: 196.00 }, // E5
      { f: 587.33, b: 0 },      // D5
      { f: 523.25, b: 174.61 }, // C5
      { f: 587.33, b: 0 },      // D5
      { f: 659.25, b: 196.00 }, // E5
      { f: 783.99, b: 0 },      // G5
      { f: 1046.50, b: 261.63 },// C6
      { f: 783.99, b: 0 },      // G5
      { f: 659.25, b: 196.00 }, // E5
      { f: 587.33, b: 0 }       // D5
    ];
    let bgMusicStep = 0;

    function playBgMusicTick() {
      if (!bgMusicPlaying || soundMuted) return;
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const step = BG_MELODY_STEPS[bgMusicStep % BG_MELODY_STEPS.length];
        bgMusicStep++;

        if (step.f) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(step.f, now);
          gain.gain.setValueAtTime(0.055, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        }
        if (step.b) {
          const bOsc = ctx.createOscillator();
          const bGain = ctx.createGain();
          bOsc.type = 'sine';
          bOsc.frequency.setValueAtTime(step.b, now);
          bGain.gain.setValueAtTime(0.045, now);
          bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          bOsc.connect(bGain);
          bGain.connect(ctx.destination);
          bOsc.start(now);
          bOsc.stop(now + 0.23);
        }
      } catch (e) {}
    }

    function setupSubModes(modes, defaultId, launchFn) {
      const subBar = document.getElementById('submode-bar');
      subBar.style.display = 'flex';
      currentSubMode = defaultId;
      subBar.innerHTML = '';
      modes.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'submode-pill' + (m.id === defaultId ? ' active' : '');
        btn.textContent = m.label;
        btn.onclick = () => {
          currentSubMode = m.id;
          subBar.querySelectorAll('.submode-pill').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          playMagicSound('pop');
          launchFn();
        };
        subBar.appendChild(btn);
      });
      launchFn();
    }

    const BALLOON_COLORS = [
      'radial-gradient(circle at 30% 30%, #ff5252, #c62828)',
      'radial-gradient(circle at 30% 30%, #80d8ff, #0277bd)',
      'radial-gradient(circle at 30% 30%, #ffcc80, #ef6c00)',

    function startBalloonWorld() {
      if (balloonLoopId) cancelAnimationFrame(balloonLoopId);
      const targetItem = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
      let poppedCount = 0;

      currentSoundOutCallback = () => {
        unicornSpeak(`Pop letter ${targetItem.letter} for ${targetItem.word}!`, { updateBubble: false });
      };

      const showcase = document.getElementById('showcase-card');
      showcase.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; flex-wrap:wrap; gap:6px;">

          </div>
          <div class="phonics-pill" id="balloon-score-pill">
            💥 Popped: <strong id="balloon-pop-count">0</strong>
          </div>
        </div>
      `;

      const area = document.getElementById('interactive-area');
      area.innerHTML = `<div class="balloon-arena" id="balloon-arena"></div>`;
      const arena = document.getElementById('balloon-arena');

      let activeBalloons = [];
      let lastSpawn = 0;

      function spawnBalloon() {
        const isTarget = Math.random() < 0.42;
        const isBonusUnicorn = !isTarget && Math.random() < 0.22;
        const randomAlpha = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
        const item = isTarget ? targetItem : randomAlpha;

        const el = document.createElement('div');
        el.className = 'balloon-node';
        el.style.background = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];

        const label = isBonusUnicorn ? '🦄' : `${item.letter}${item.letter.toLowerCase()}`;
        const sub = isBonusUnicorn ? '💵' : item.emoji;
        el.innerHTML = `<span>${label}</span><span style="font-size:1.1rem; line-height:1;">${sub}</span>`;

        const arenaWidth = arena.clientWidth || 340;
        const x = Math.random() * Math.max(20, arenaWidth - 88) + 6;
        const bObj = {
          el,
          x,
          y: (arena.clientHeight || 300) + 20,
          speed: Math.random() * 0.75 + 0.7,
          wobbleOffset: Math.random() * Math.PI * 2,
          item,
          isTarget,
          isBonusUnicorn
        };

        const popHandler = (ev) => {
          ev.stopPropagation();
          const rect = el.getBoundingClientRect();
          burstSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 28);

          poppedCount++;
          const counterEl = document.getElementById('balloon-pop-count');
          if (counterEl) counterEl.textContent = poppedCount;

          if (bObj.isTarget) {
            playMagicSound('success');
            addStar();
            // Only speak brief acknowledgement when popping the target letter!
            unicornSpeak(`Yay! ${item.letter} for ${item.word}!`, { updateBubble: false });
          } else if (bObj.isBonusUnicorn) {
            playMagicSound('legoStud');
            addStar();
          } else {
            playMagicSound('pop');
          }

          el.remove();
          activeBalloons = activeBalloons.filter(b => b !== bObj);
        };

        el.addEventListener('pointerdown', popHandler);
        arena.appendChild(el);
        activeBalloons.push(bObj);
      }

      for (let i = 0; i < 4; i++) {
        spawnBalloon();
        activeBalloons[activeBalloons.length - 1].y -= i * 65;
      }

      function stepBalloons(ts) {
        if (currentWorld !== 'balloon') return;
        if (ts - lastSpawn > 1150 && activeBalloons.length < 7) {
          spawnBalloon();
          lastSpawn = ts;
        }
        for (let i = activeBalloons.length - 1; i >= 0; i--) {
          const b = activeBalloons[i];
          b.y -= b.speed;
          const sway = Math.sin(ts * 0.003 + b.wobbleOffset) * 8;
          b.el.style.transform = `translate3d(${b.x + sway}px, ${b.y}px, 0)`;
          if (b.y < -110) {
            b.el.remove();
            activeBalloons.splice(i, 1);
          }
        }
        balloonLoopId = requestAnimationFrame(stepBalloons);
      }

      balloonLoopId = requestAnimationFrame(stepBalloons);
      unicornSpeak(`Pop the ${targetItem.letter} balloons for ${targetItem.word}!`);
    }

    /*************************************************************************
     * WORLD 9: 🎂 DUCK CAKE & CANDY CRUSH
     *************************************************************************/
    const CANDY_TYPES = ['🎂', '🧁', '🍓', '🍭', '🌈'];

    function startCandyWorld() {
      const ROWS = 5;
      const COLS = 5;
      let board = [];
      let selectedCell = null;
      let crushBusy = false;
      let crushedTotal = 0;

      currentSoundOutCallback = () => {
        unicornSpeak("Tap matching treats or swap two treats!", { updateBubble: false });
      };

      document.getElementById('speech-text').textContent = "🎂 Tap matching treats next to each other, or swap 2 treats to crush them!";

      const showcase = document.getElementById('showcase-card');
      showcase.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; flex-wrap:wrap; gap:6px;">
          <div style="font-size:1rem; font-weight:700; color:#2b4c7e;">
            🎂 Tap matching treats or swap 2 treats!
          </div>
          <div class="phonics-pill">
            🎂 Crushed: <strong id="candy-crush-score">0</strong> (Every 10 = ⭐!)
          </div>
        </div>
      `;

      const area = document.getElementById('interactive-area');
      area.innerHTML = `<div class="candy-board" id="candy-board"></div>`;
      const boardEl = document.getElementById('candy-board');

      function randomCandy() {
        return CANDY_TYPES[Math.floor(Math.random() * CANDY_TYPES.length)];
      }

      function initBoard() {
        board = [];
        for (let r = 0; r < ROWS; r++) {
          const row = [];
          for (let c = 0; c < COLS; c++) {
            row.push(randomCandy());
          }
          board.push(row);
        }
        board[2][2] = board[2][3];
        board[1][1] = board[2][1];
      }

      function getConnectedGroup(startR, startC) {
        const target = board[startR][startC];
        const visited = new Set();
        const queue = [[startR, startC]];
        const group = [];

        while (queue.length > 0) {
          const [r, c] = queue.shift();
          const key = `${r},${c}`;
          if (visited.has(key)) continue;
          visited.add(key);
          if (board[r][c] === target) {
            group.push([r, c]);
            [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr, nc]) => {
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !visited.has(`${nr},${nc}`)) {
                queue.push([nr, nc]);
              }
            });
          }
        }
        return group;
      }

      function findAllMatches3OrMore() {
        const matched = new Set();
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS - 2; c++) {
            const v = board[r][c];
            if (v && board[r][c+1] === v && board[r][c+2] === v) {
              matched.add(`${r},${c}`);
              matched.add(`${r},${c+1}`);
              matched.add(`${r},${c+2}`);
            }
          }
        }
        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r < ROWS - 2; r++) {
            const v = board[r][c];
            if (v && board[r+1][c] === v && board[r+2][c] === v) {
              matched.add(`${r},${c}`);
              matched.add(`${r+1},${c}`);
              matched.add(`${r+2},${c}`);
            }
          }
        }
        return Array.from(matched).map(s => s.split(',').map(Number));
      }

      function crushCoordinates(coords) {
        if (!coords.length) return;
        crushBusy = true;

        coords.forEach(([r, c]) => {
          const cellEl = document.getElementById(`candy-${r}-${c}`);
          if (cellEl) {
            cellEl.classList.add('crushing');
            const rect = cellEl.getBoundingClientRect();
            burstSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 14);
          }
          board[r][c] = null;
        });

        const prevTens = Math.floor(crushedTotal / 10);
        crushedTotal += coords.length;
        const newTens = Math.floor(crushedTotal / 10);

        const scoreEl = document.getElementById('candy-crush-score');
        if (scoreEl) scoreEl.textContent = crushedTotal;

        // Pure sound effects when crushing treats (no voice spam!)
        if (newTens > prevTens) {
          addStar();
          playMagicSound('success');
        } else if (coords.length >= 4) {
          playMagicSound('legoStud');
        } else {
          playMagicSound('sparkle');
        }

        setTimeout(() => {
          for (let c = 0; c < COLS; c++) {
            let emptyRow = ROWS - 1;
            for (let r = ROWS - 1; r >= 0; r--) {
              if (board[r][c] !== null) {
                board[emptyRow][c] = board[r][c];
                if (emptyRow !== r) board[r][c] = null;
                emptyRow--;
              }
            }
            for (let r = emptyRow; r >= 0; r--) {
              board[r][c] = randomCandy();
            }
          }
          renderCandyBoard();
          crushBusy = false;
        }, 340);
      }

      function handleCandyTap(r, c) {
        if (crushBusy) return;

        if (!selectedCell) {
          const group = getConnectedGroup(r, c);
          if (group.length >= 2) {
            crushCoordinates(group);
            return;
          }
          selectedCell = { r, c };
          playMagicSound('pop');
          renderCandyBoard();
          return;
        }

        if (selectedCell.r === r && selectedCell.c === c) {
          selectedCell = null;
          renderCandyBoard();
          return;
        }

        const r1 = selectedCell.r, c1 = selectedCell.c;
        selectedCell = null;
        const tmp = board[r1][c1];
        board[r1][c1] = board[r][c];
        board[r][c] = tmp;
        renderCandyBoard();

        const matches3 = findAllMatches3OrMore();
        if (matches3.length >= 3) {
          crushCoordinates(matches3);
          return;
        }
        const g1 = getConnectedGroup(r, c);
        const g2 = getConnectedGroup(r1, c1);
        const combined = [...(g1.length >= 2 ? g1 : []), ...(g2.length >= 2 ? g2 : [])];
        if (combined.length >= 2) {
          crushCoordinates(combined);
        } else {
          playMagicSound('pop');
        }
      }

      function renderCandyBoard() {
        boardEl.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.id = `candy-${r}-${c}`;
            const isSel = selectedCell && selectedCell.r === r && selectedCell.c === c;
            cell.className = 'candy-cell' + (isSel ? ' selected' : '');
            cell.textContent = board[r][c];
            cell.onclick = () => handleCandyTap(r, c);
            boardEl.appendChild(cell);
          }
        }
      }

      initBoard();
      renderCandyBoard();
      playMagicSound('sparkle');
    }

    function drawStuddedLegoBrick(c, x, y, w, h, colorObj, label = '') {
      drawLegoShape(c, { x, y, w, h, colorObj, shape: '2x4', label }, false);
    }

    // Master 2.5D Glossy Molded Plastic LEGO Brick Renderer
    function drawLegoShape(c, br, isGhost = false, ghostValid = true, ts = 0) {
      const { x, y, w, h, colorObj, shape = '2x4', label = '' } = br;
      const col = colorObj || LEGO_COLORS[0];

      c.save();
      if (isGhost) {
        c.globalAlpha = 0.52;
      }

      const studCount = Math.max(1, Math.round(w / LEGO_STUD_W));
      const studW = 14;
      const studH = 5;
      const depthX = 4;
      const depthY = 4;

      // 1. Draw 2.5D Cylindrical LEGO Studs with Elliptical Caps & Specular Gloss
      const noStudShapes = ['horn', 'crown', 'roof', 'flag', 'rotor', 'crystal'];
      if (!noStudShapes.includes(shape)) {
        for (let i = 0; i < studCount; i++) {
          if (shape === 'slopeL' && i < studCount - 1) continue;
          if (shape === 'slopeR' && i > 0) continue;
          const sx = x + i * LEGO_STUD_W + (LEGO_STUD_W - studW) / 2;
          const sy = y - studH;

          // Stud cylinder body
          c.fillStyle = col.hex;
          c.fillRect(sx, sy, studW, studH + 1);
          // Stud specular highlight
          c.fillStyle = 'rgba(255,255,255,0.45)';
          c.fillRect(sx + 2, sy, 4, studH);
          // Stud top elliptical cap
          c.fillStyle = col.top || col.hex;
          c.beginPath();
          c.ellipse(sx + studW / 2, sy, studW / 2, 2.2, 0, 0, Math.PI * 2);
          c.fill();
          c.strokeStyle = 'rgba(0,0,0,0.28)';
          c.lineWidth = 1.1;
          c.strokeRect(sx, sy, studW, studH);
        }
      }

      // Helper for 2.5D Beveled Block Base
      const drawBevelBox = (bx, by, bw, bh) => {
        // 3D Top Deck Plane
        c.fillStyle = col.top || col.hex;
        c.beginPath();
        c.moveTo(bx, by);
        c.lineTo(bx + depthX, by - depthY);
        c.lineTo(bx + bw + depthX, by - depthY);
        c.lineTo(bx + bw, by);
        c.closePath();
        c.fill();

        // 3D Right Side Extrusion Wall
        c.fillStyle = col.side || col.hex;
        c.beginPath();
        c.moveTo(bx + bw, by);
        c.lineTo(bx + bw + depthX, by - depthY);
        c.lineTo(bx + bw + depthX, by + bh - depthY);
        c.lineTo(bx + bw, by + bh);
        c.closePath();
        c.fill();

        // Front Glossy Face
        c.fillStyle = col.hex;
        c.fillRect(bx, by, bw, bh);
        // Glossy top shine strip
        c.fillStyle = 'rgba(255,255,255,0.32)';
        c.fillRect(bx + 2, by + 2, bw - 4, 3);
        // Bottom shadow strip
        c.fillStyle = 'rgba(0,0,0,0.2)';
        c.fillRect(bx, by + bh - 3, bw, 3);
        c.strokeStyle = 'rgba(49, 27, 146, 0.35)';
        c.lineWidth = 1.4;
        c.strokeRect(bx, by, bw, bh);
      };

      // 2. Draw Main LEGO Shape Geometry
      if (shape === 'slopeL') {
        c.fillStyle = col.hex;
        c.beginPath();
        c.moveTo(x, y + h);
        c.lineTo(x + w - LEGO_STUD_W, y);
        c.lineTo(x + w, y);
        c.lineTo(x + w, y + h);
        c.closePath();
        c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.32)';
        c.lineWidth = 1.5;
        c.stroke();
      } else if (shape === 'slopeR') {
        c.fillStyle = col.hex;
        c.beginPath();
        c.moveTo(x, y);
        c.lineTo(x + LEGO_STUD_W, y);
        c.lineTo(x + w, y + h);
        c.lineTo(x, y + h);
        c.closePath();
        c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.32)';
        c.lineWidth = 1.5;
        c.stroke();
      } else if (shape === 'roof') {
        c.fillStyle = col.hex;
        c.beginPath();
        c.moveTo(x, y + h);
        c.lineTo(x + w / 2, y - 6);
        c.lineTo(x + w, y + h);
        c.closePath();
        c.fill();
        c.fillStyle = 'rgba(255,255,255,0.28)';
        c.beginPath();
        c.moveTo(x + 4, y + h - 2);
        c.lineTo(x + w / 2, y - 3);
        c.lineTo(x + w / 2, y + h - 2);
        c.closePath();
        c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.32)';
        c.lineWidth = 1.5;
        c.stroke();
      } else if (shape === 'arch') {
        c.fillStyle = col.hex;
        c.beginPath();
        c.moveTo(x, y);
        c.lineTo(x + w, y);
        c.lineTo(x + w, y + h);
        c.lineTo(x + w - LEGO_STUD_W, y + h);
        c.arc(x + w / 2, y + h, w / 2 - LEGO_STUD_W, 0, Math.PI, true);
        c.lineTo(x, y + h);
        c.closePath();
        c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.32)';
        c.lineWidth = 1.5;
        c.stroke();
      } else if (shape === 'round') {
        c.fillStyle = col.hex;
        c.beginPath();
        c.roundRect(x + 4, y, w - 8, h, 10);
        c.fill();
        c.fillStyle = 'rgba(255,255,255,0.35)';
        c.fillRect(x + 10, y + 2, 7, h - 4);
        c.strokeStyle = 'rgba(0,0,0,0.3)';
        c.stroke();
      } else if (shape === 'turret') {
        drawBevelBox(x, y + 10, w, h - 10);
        for (let i = 0; i < studCount; i += 2) {
          drawBevelBox(x + i * LEGO_STUD_W, y, LEGO_STUD_W + 6, 12);
        }
      } else if (shape === 'flag') {
        // Pole + Animated waving royal pennant
        drawBevelBox(x + 16, y + h - 10, 16, 10);
        c.fillStyle = '#ffd700';
        c.fillRect(x + 22, y + 4, 4, h - 14);
        const wave = Math.sin((ts || performance.now()) * 0.008 + x) * 4;
        c.fillStyle = col.hex;
        c.beginPath();
        c.moveTo(x + 26, y + 6);
        c.quadraticCurveTo(x + 38, y + 10 + wave, x + 48, y + 14);
        c.lineTo(x + 26, y + 26);
        c.closePath();
        c.fill();
        c.strokeStyle = '#ffffff';
        c.lineWidth = 1.2;
        c.stroke();
      } else if (shape === 'crystal') {
        c.fillStyle = col.top || '#ff80ab';
        c.beginPath();
        c.moveTo(x + w / 2, y - 6);
        c.lineTo(x + w - 6, y + h / 2);
        c.lineTo(x + w - 12, y + h);
        c.lineTo(x + 12, y + h);
        c.lineTo(x + 6, y + h / 2);
        c.closePath();
        c.fill();
        c.fillStyle = 'rgba(255,255,255,0.55)';
        c.beginPath();
        c.moveTo(x + w / 2, y - 4);
        c.lineTo(x + w / 2 - 8, y + h - 2);
        c.lineTo(x + 12, y + h / 2);
        c.closePath();
        c.fill();
        c.strokeStyle = '#ffffff';
        c.lineWidth = 1.5;
        c.stroke();
      } else if (shape !== 'horn' && shape !== 'crown') {
        drawBevelBox(x, y, w, h);
        // Subtle internal LEGO anti-stud tube circles
        c.fillStyle = 'rgba(255,255,255,0.16)';
        for (let i = 0; i < studCount; i++) {
          c.beginPath();
          c.arc(x + (i + 0.5) * LEGO_STUD_W, y + 14, 4.5, 0, Math.PI * 2);
          c.fill();
        }
      }

      // 3. Draw Specialized Animated & Interactive LEGO Details
      if (shape === 'wheel') {
        const spin = ((ts || performance.now()) * 0.005) % (Math.PI * 2);
        c.fillStyle = '#2a0845';
        c.beginPath();
        c.arc(x + w / 2, y + h / 2 + 2, 13, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#ffd54f';
        c.beginPath();
        c.arc(x + w / 2, y + h / 2 + 2, 6.5, 0, Math.PI * 2);
        c.fill();
        c.strokeStyle = '#ec407a';
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(x + w / 2 - Math.cos(spin) * 6, y + h / 2 + 2 - Math.sin(spin) * 6);
        c.lineTo(x + w / 2 + Math.cos(spin) * 6, y + h / 2 + 2 + Math.sin(spin) * 6);
        c.stroke();
      } else if (shape === 'rotor') {
        const bladeW = Math.abs(Math.sin((ts || performance.now()) * 0.015)) * (w / 2 - 4) + 10;
        c.fillStyle = '#ffd700';
        c.fillRect(x + w / 2 - 5, y - 6, 10, 8);
        c.fillStyle = '#ffffff';
        c.fillRect(x + w / 2 - bladeW, y - 5, bladeW * 2, 4);
        c.strokeStyle = '#ad1457';
        c.strokeRect(x + w / 2 - bladeW, y - 5, bladeW * 2, 4);
      } else if (shape === 'thruster') {
        // Rocket thruster nozzle + animated pink/gold flame!
        c.fillStyle = '#311b92';
        c.beginPath();
        c.moveTo(x + 8, y + h);
        c.lineTo(x + 4, y + h + 8);
        c.lineTo(x + w - 4, y + h + 8);
        c.lineTo(x + w - 8, y + h);
        c.closePath();
        c.fill();
        const flameH = 8 + Math.abs(Math.sin((ts || performance.now()) * 0.025 + x)) * 12;

        c.moveTo(x + 10, y + h + 6);
        c.lineTo(x + w / 2, y + h + 6 + flameH);

        c.fill();
      } else if (shape === 'window') {
        c.fillStyle = '#fff59d';
        c.fillRect(x + 6, y + 5, 15, h - 10);
        c.fillRect(x + w - 21, y + 5, 15, h - 10);

        c.strokeRect(x + 6, y + 5, 15, h - 10);
        c.strokeRect(x + w - 21, y + 5, 15, h - 10);
      } else if (shape === 'door') {
        c.fillStyle = '#f8bbd0';
        c.fillRect(x + 7, y + 7, w - 14, h - 10);
        c.fillStyle = '#fff59d';
        c.beginPath();
        c.arc(x + w / 2, y + 20, 10, Math.PI, 0);

        c.fillStyle = '#ffd700';
        c.beginPath();
        c.arc(x + w - 13, y + h / 2 + 4, 3.2, 0, Math.PI * 2);

      } else if (shape === 'spring') {

        c.moveTo(x + 8, y + h - 4);
        c.lineTo(x + w - 8, y + h - 10);

      } else if (shape === 'flower') {

          c.beginPath();

      } else if (shape === 'horn') {
        c.fillStyle = '#ffd700';
        c.beginPath();
        c.moveTo(x + 10, y + h);
        c.lineTo(x + w / 2, y - 12);

        c.fill();
        c.strokeStyle = '#ff6f00';

      } else if (shape === 'crown') {
        c.fillStyle = '#ffd700';
        c.beginPath();
        c.moveTo(x + 6, y + h);
        c.lineTo(x + 6, y + 5);

        c.lineTo(x + w / 2, y + 2);
        c.lineTo(x + w - 16, y + 15);
        c.lineTo(x + w - 6, y + 5);
        c.lineTo(x + w - 6, y + h);
        c.closePath();
        c.fill();
        c.strokeStyle = '#ff6f00';
        c.lineWidth = 1.5;
        c.stroke();
        // Pink & purple crown jewels
        c.fillStyle = '#ff1493';
        c.beginPath();
        c.arc(x + w / 2, y + 18, 3.5, 0, Math.PI * 2);
        c.fill();
      } else if (label) {
        c.fillStyle = '#ffffff';
        c.font = '700 13px Fredoka, Andika, sans-serif';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText(label, x + w / 2, y + h / 2 + 1);
      }

      c.restore();

      if (isGhost) {
        c.save();
        c.strokeStyle = ghostValid ? '#ffeb3b' : '#ff4081';
        c.lineWidth = 2.5;
        c.setLineDash([5, 4]);
        c.strokeRect(x - 1, y - 1, w + 2, h + 2);
        c.restore();
      }
    }
