<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd1f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Loveable Unicorns 🦄 Kindergarten Kingdom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink-hot: #ff1493;
      --pink-main: #ff4da6;
      --pink-soft: #ffb3d9;
      --purple-main: #9c27b0;
      --purple-dark: #4a148c;
      --gold: #ffd700;
      --mint: #00e676;
      --sky-1: #ffd1f0;
      --sky-2: #e8d1ff;
      --sky-3: #ccf2ff;
      --font-print: 'Andika', 'Fredoka', Roboto, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      --font-ui: 'Fredoka', 'Andika', Roboto, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    /* =========================================================================
       1. MOBILE FIRST BASE STYLES (Phone portrait: Pixel 8 / iPhone)
       ========================================================================= */
    body {
      font-family: var(--font-ui);
      background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 50%, var(--sky-3) 100%);
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--purple-dark);
      padding: 6px 8px 18px;
    }

    .rainbow-bg {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 110vw;
      max-width: 860px;
      height: 300px;
      border-radius: 450px 450px 0 0;
      box-shadow:
        0 -12px 0 0 rgba(255, 94, 158, 0.22),
        0 -24px 0 0 rgba(255, 165, 82, 0.22),
        0 -36px 0 0 rgba(255, 235, 102, 0.22),
        0 -48px 0 0 rgba(114, 239, 157, 0.22),
        0 -60px 0 0 rgba(107, 203, 255, 0.22),
        0 -72px 0 0 rgba(190, 133, 255, 0.22);
      pointer-events: none;
      z-index: 0;
    }

    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      font-size: 2.6rem;
      opacity: 0.45;
      animation: floatCloud linear infinite;
    }

    @keyframes floatCloud {
      from { transform: translateX(-120px); }
      to { transform: translateX(calc(100vw + 120px)); }
    }

    /* Compact Mobile Top Bar */
    .game-header {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 980px;
      padding: 2px 2px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .brand-pill {
      background: linear-gradient(135deg, #ffffff, #fff0f8);
      border: 3px solid #ff66b3;
      border-radius: 999px;
      padding: 4px 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 0 #ff66b3;
      font-size: 0.94rem;
      font-weight: 700;
      color: #c2185b;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .star-pill {
      background: linear-gradient(135deg, #fff9c4, #ffd54f);
      border: 3px solid #ffa000;
      border-radius: 999px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 1rem;
      font-weight: 700;
      color: #8d4e00;
      box-shadow: 0 3px 0 #ffa000;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .star-pill.pop {
      transform: scale(1.25) rotate(5deg);
    }

    .ctrl-btn {
      background: #ffffff;
      border: 3px solid #ab47bc;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: var(--font-ui);
      color: #6a1b9a;
      cursor: pointer;
      box-shadow: 0 3px 0 #ab47bc;
      white-space: nowrap;
    }

    .ctrl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #ab47bc;
    }

    /* Mobile-First 5x2 Compact World Selector Grid (10 Worlds!) */
    .world-nav {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .world-btn {
      border: 2.5px solid #ffffff;
      border-radius: 14px;
      padding: 5px 2px;
      font-size: 0.74rem;
      font-weight: 700;
      font-family: var(--font-ui);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
      line-height: 1.1;
    }

    .world-btn .w-icon {
      font-size: 1.2rem;
    }

    .world-btn.active {
      outline: 3px solid #ffd700;
      transform: translateY(-1px);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25), 0 0 10px rgba(255, 215, 0, 0.85);
    }

    .w-abc     { background: linear-gradient(135deg, #ff4081, #c51162); }
    .w-blend   { background: linear-gradient(135deg, #ff7043, #d84315); }
    .w-math    { background: linear-gradient(135deg, #ab47bc, #6a1b9a); }
    .w-days    { background: linear-gradient(135deg, #29b6f6, #0277bd); }
    .w-seasons { background: linear-gradient(135deg, #66bb6a, #2e7d32); }
    .w-shapes  { background: linear-gradient(135deg, #ffa726, #ef6c00); }
    .w-rhyme   { background: linear-gradient(135deg, #ec407a, #880e4f); }
    .w-balloon { background: linear-gradient(135deg, #00bcd4, #00838f); }
    .w-candy   { background: linear-gradient(135deg, #e040fb, #7b1fa2); }
    .w-closet  { background: linear-gradient(135deg, #ffd54f, #f57f17); color: #5d2900; }

    /* Main Stage Card (Mobile First) */
    main {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 960px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 4px solid #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 28px rgba(156, 39, 176, 0.18);
      padding: 10px 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Compact Unicorn + Speech Row for Phone Screens */
    .unicorn-header-stage {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-bottom: 8px;
    }

    .unicorn-avatar-box {
      position: relative;
      width: 82px;
      height: 82px;
      background: radial-gradient(circle, #ffffff 35%, #ffd1f0 100%);
      border: 3.5px solid #ff66b3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(255, 20, 147, 0.25);
      cursor: pointer;
      flex-shrink: 0;
    }

    .unicorn-avatar-box svg {
      width: 72px;
      height: 72px;
    }

    .unicorn-avatar-box.dancing {
      animation: sparkleDance 0.55s ease infinite alternate;
    }

    @keyframes sparkleDance {
      0% { transform: translateY(0) rotate(-6deg) scale(1.04); }
      100% { transform: translateY(-8px) rotate(7deg) scale(1.08); }
    }

    #unicorn-mouth-open {
      opacity: 0;
      transition: opacity 0.08s;
    }
    .speaking #unicorn-mouth-open {
      opacity: 1;
      animation: talkMouth 0.22s infinite alternate;
    }
    .speaking #unicorn-horn {
      filter: drop-shadow(0 0 8px #ffd700);
    }

    @keyframes talkMouth {
      0% { transform: scaleY(0.4); transform-origin: 85px 65px; }
      100% { transform: scaleY(1.15); transform-origin: 85px 65px; }
    }

    .acc-badge {
      position: absolute;
      font-size: 1.4rem;
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
    }
    .acc-crown { top: -12px; left: 50%; transform: translateX(-50%); }
    .acc-wand  { bottom: 0; right: -8px; transform: rotate(15deg); }
    .acc-pet   { bottom: -5px; left: -8px; }
    .acc-wings { top: 15px; left: -11px; font-size: 1.3rem; }

    /* Speech Bubble */
    .speech-card {
      flex: 1;
      min-width: 0;
      background: linear-gradient(135deg, #ffffff, #fff5fb);
      border: 3px solid #ff66b3;
      border-radius: 18px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 4px 0 #ffb3d9;
    }

    .speech-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .unicorn-tag {
      display: inline-block;
      background: #ff4081;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      letter-spacing: 0.3px;
    }

    .speech-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .action-circle-btn {
      background: linear-gradient(135deg, #ff4081, #c51162);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 99px;
      height: 30px;
      min-width: 30px;
      padding: 0 8px;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 3px 0 #880e4f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ui);
      font-weight: 700;
    }

    .action-circle-btn.phonics-btn {
      background: linear-gradient(135deg, #ab47bc, #6a1b9a);
      box-shadow: 0 3px 0 #4a148c;
      font-size: 0.74rem;
      gap: 3px;
    }

    .action-circle-btn:active {
      transform: translateY(2px);
    }

    .speech-text {
      font-family: var(--font-print);
      font-size: 0.95rem;
      font-weight: 700;
      color: #880e4f;
      line-height: 1.25;
    }

    /* Sub-mode pill bar */
    .submode-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      width: 100%;
    }

    .submode-pill {
      background: #fce4ec;
      border: 2.5px solid #f48fb1;
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: var(--font-ui);
      color: #880e4f;
      cursor: pointer;
    }

    .submode-pill.active {
      background: #ff4081;
      border-color: #c51162;
      color: #ffffff;
      box-shadow: 0 3px 0 #880e4f;
    }

    /* Showcase Stage (Mobile First) */
    .showcase-card {
      background: linear-gradient(180deg, #fff8fc 0%, #fce4ec 100%);
      border: 3px dashed #ff66b3;
      border-radius: 20px;
      padding: 10px 12px;
      margin-bottom: 10px;
      width: 100%;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    .big-prompt-display {
      font-family: var(--font-print);
      font-size: 2.1rem;
      font-weight: 700;
      color: #c2185b;
      text-shadow: 2px 2px 0 #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      line-height: 1.15;
    }

    .phonics-pill {
      background: #fff9c4;
      border: 2.5px solid #fbc02d;
      border-radius: 16px;
      padding: 4px 12px;
      font-family: var(--font-print);
      font-size: 0.94rem;
      color: #8d4e00;
      cursor: pointer;
      box-shadow: 0 3px 0 #fbc02d;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Sound-It-Out Word Blender Tiles */
    .blender-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin: 4px 0;
    }

    .letter-tile {
      width: 66px;
      height: 76px;
      background: linear-gradient(180deg, #ffffff, #f3e5f5);
      border: 4px solid #ab47bc;
      border-radius: 18px;
      font-family: var(--font-print);
      font-size: 2.2rem;
      font-weight: 700;
      color: #4a148c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #7b1fa2;
    }

    .letter-tile.sounded {
      background: linear-gradient(180deg, #fff9c4, #ffe082);
      border-color: #ffa000;
      box-shadow: 0 5px 0 #ff6f00;
      transform: translateY(-4px) scale(1.05);
    }

    .tile-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ce93d8;
      margin-top: 2px;
    }

    .letter-tile.sounded .tile-dot {
      background: #ff4081;
    }

    .blend-arrow-btn {
      background: linear-gradient(135deg, #ff4081, #f50057);
      color: #fff;
      border: 3px solid #fff;
      border-radius: 99px;
      padding: 6px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: var(--font-ui);
      cursor: pointer;
      box-shadow: 0 4px 0 #ad1457;
    }

    /* Mobile-First 2x2 Answer Choices Grid */
    .choices-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .choice-btn {
      background: linear-gradient(180deg, #ffffff 0%, #fff0f7 100%);
      border: 4px solid #ff80ab;
      border-radius: 22px;
      padding: 12px 8px;
      min-height: 92px;
      font-size: 2.1rem;
      font-weight: 700;
      font-family: var(--font-print);
      color: #ad1457;
      cursor: pointer;
      box-shadow: 0 6px 0 #f06292, 0 8px 14px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.12s, background 0.2s;
    }

    .choice-btn .choice-label {
      font-family: var(--font-print);
      font-size: 1.02rem;
      color: #6a1b9a;
      font-weight: 700;
    }

    .choice-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #f06292;
    }

    .choice-btn.correct {
      background: linear-gradient(180deg, #b9f6ca, #69f0ae);
      border-color: #00c853;
      color: #1b5e20;
      box-shadow: 0 6px 0 #00c853;
      animation: correctPop 0.55s ease;
    }

    .choice-btn.wrong {
      background: #fce4ec;
      opacity: 0.6;
      animation: gentleShake 0.4s ease;
    }

    @keyframes correctPop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12) rotate(2deg); }
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Counting & Math Objects */
    .counting-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 4px;
    }

    .count-card {
      font-size: 2.1rem;
      width: 56px;
      height: 56px;
      background: #fff;
      border: 3px solid #f48fb1;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 0 #f48fb1;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .count-card.counted {
      background: #fff9c4;
      border-color: #ffa000;
      box-shadow: 0 4px 0 #ffa000;
      transform: scale(1.1);
    }

    .count-num-badge {
      position: absolute;
      bottom: -7px;
      right: -7px;
      background: #ff1493;
      color: #fff;
      font-family: var(--font-print);
      font-size: 0.85rem;
      font-weight: 700;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Days of the Week Rainbow Train */
    .days-train {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }

    .day-car {
      padding: 6px 4px;
      border-radius: 14px;
      border: 2.5px solid #fff;
      color: #fff;
      font-family: var(--font-print);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .day-car.mystery {
      background: #ffffff !important;
      color: #d81b60 !important;
      border: 3px dashed #ff4081;
      animation: pulseMystery 1s infinite alternate;
    }

    @keyframes pulseMystery {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    /* =========================================================================
       MINI GAME 1: 🎈 BALLOON POP ARENA
       ========================================================================= */
    .balloon-arena {
      position: relative;
      width: 100%;
      height: 310px;
      background: linear-gradient(180deg, #b3e5fc 0%, #e1bee7 65%, #f8bbd0 100%);
      border: 4px solid #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: inset 0 6px 20px rgba(0,0,0,0.08);
      touch-action: manipulation;
    }

    .balloon-node {
      position: absolute;
      width: 78px;
      height: 94px;
      border-radius: 50% 50% 48% 48%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-print);
      font-size: 1.9rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      cursor: pointer;
      box-shadow: inset -8px -8px 16px rgba(0,0,0,0.18), inset 8px 8px 16px rgba(255,255,255,0.45), 0 6px 14px rgba(0,0,0,0.12);
      transition: transform 0.1s;
      user-select: none;
    }

    .balloon-node::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      width: 2px;
      height: 18px;
      background: rgba(255,255,255,0.85);
      transform: translateX(-50%);
    }

    .balloon-node:active {
      transform: scale(1.2);
    }

    /* =========================================================================
       MINI GAME 2: 🍬 UNICORN CANDY CRUSH
       ========================================================================= */
    .candy-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 390px;
      background: linear-gradient(180deg, #fce4ec, #f3e5f5);
      border: 4px solid #ff80ab;
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 8px 0 #f06292;
      touch-action: manipulation;
    }

    .candy-cell {
      aspect-ratio: 1 / 1;
      background: linear-gradient(180deg, #ffffff, #fff5fb);
      border: 3.5px solid #f8bbd0;
      border-radius: 18px;
      font-size: 2.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #f48fb1;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s, border-color 0.15s;
    }

    .candy-cell.selected {
      background: #fff9c4;
      border-color: #ffd700;
      box-shadow: 0 0 14px #ffd700;
      transform: scale(1.12);
      z-index: 2;
    }

    .candy-cell.crushing {
      animation: candyCrushAnim 0.35s ease forwards;
    }

    @keyframes candyCrushAnim {
      0% { transform: scale(1.25) rotate(12deg); opacity: 1; background: #fff59d; }
      100% { transform: scale(0.1) rotate(-25deg); opacity: 0; }
    }

    /* Explore / Soundboard Grid */
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }

    .explore-key {
      background: #fff;
      border: 3px solid #ce93d8;
      border-radius: 16px;
      padding: 8px 4px;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: var(--font-print);
      color: #6a1b9a;
      cursor: pointer;
      box-shadow: 0 4px 0 #ab47bc;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    /* Royal Closet Grid */
    .closet-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .closet-card {
      background: #fff;
      border: 3.5px solid #f48fb1;
      border-radius: 18px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #f48fb1;
      font-family: var(--font-print);
    }

    .closet-card.equipped {
      background: #fff9c4;
      border-color: #ffa000;
      box-shadow: 0 5px 0 #ffa000;
    }

    .closet-card.locked {
      opacity: 0.65;

    let preferredVoice = null;

    function selectBestGirlyVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;

      const priorityNames = [
        'Microsoft Ana',
        'Microsoft Aria',
        'Microsoft Jenny',
        'Google US English',
        'Samantha',
        'Victoria',
        'Karen',
        'Moira',
        'Tessa',
        'Microsoft Zira'
      ];

      for (const name of priorityNames) {
        const match = voices.find(v => v.name.includes(name) && v.lang.startsWith('en'));
        if (match) {
          preferredVoice = match;
          return;
        }
      }
      preferredVoice = voices.find(v => v.lang.startsWith('en') && /female|girl|woman|zira|samantha/i.test(v.name))
                    || voices.find(v => v.lang.startsWith('en'))
                    || voices[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = selectBestGirlyVoice;
      selectBestGirlyVoice();
    }

    function cleanForSpeech(str) {
      return str
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function unicornSpeak(text, options = {}) {
      const { updateBubble = true, isSoundOut = false, customRate = null, customPitch = null } = options;
      if (updateBubble) {
        lastSpokenPrompt = text;
        document.getElementById('speech-text').textContent = text;
      }
      if (soundMuted || !('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      if (!preferredVoice) selectBestGirlyVoice();

      const style = VOICE_STYLES[voiceEnergyMode];
      const ubox = document.getElementById('unicorn-box');

      const rawClean = cleanForSpeech(text);
      const chunks = isSoundOut
        ? rawClean.split('|').map(s => s.trim()).filter(Boolean)
        : [rawClean];

      chunks.forEach((chunk, idx) => {
        const utter = new SpeechSynthesisUtterance(chunk);
        if (preferredVoice) utter.voice = preferredVoice;

        const isExclaim = chunk.includes('!');
        utter.pitch = customPitch || (style.pitch + (isExclaim ? 0.08 : 0));
        utter.rate = customRate || (isSoundOut ? 0.82 : style.rate);

        utter.onstart = () => ubox.classList.add('speaking');
        utter.onend = () => {
          if (idx === chunks.length - 1) ubox.classList.remove('speaking');
        };
        utter.onerror = () => ubox.classList.remove('speaking');

        window.speechSynthesis.speak(utter);
      });
    }

      playMagicSound('pop');

    /*************************************************************************
     * 3. WEB AUDIO API MAGICAL SOUND EFFECTS
     *************************************************************************/
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playMagicSound(type = 'success') {
      if (soundMuted) return;
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        if (type === 'success') {
          const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
          notes.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + i * 0.065);
            gain.gain.setValueAtTime(0.2, now + i * 0.065);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.065 + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.065);
            osc.stop(now + i * 0.065 + 0.4);
          });
        } else if (type === 'sparkle') {
          const notes = [880, 1174.66, 1396.91, 1760];
          notes.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.05);
            gain.gain.setValueAtTime(0.15, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.25);
          });
        } else if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(980, now + 0.11);
          gain.gain.setValueAtTime(0.26, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === 'oops') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(310, now);
          osc.frequency.linearRampToValueAtTime(220, now + 0.22);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        }
      } catch (e) {}
    }

      let activeBalloons = [];

      function spawnBalloon() {
        const isTarget = Math.random() < 0.42;
        const isBonusUnicorn = !isTarget && Math.random() < 0.2;
        const randomAlpha = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
        const item = isTarget ? targetItem : randomAlpha;

        const el = document.createElement('div');

        const label = isBonusUnicorn ? '🦄' : `${item.letter}${item.letter.toLowerCase()}`;
        const sub = isBonusUnicorn ? '⭐' : item.emoji;
        el.innerHTML = `<span>${label}</span><span style="font-size:1.1rem; line-height:1;">${sub}</span>`;

        const arenaWidth = arena.clientWidth || 340;
        const x = Math.random() * Math.max(20, arenaWidth - 88) + 6;
        const bObj = {
          el,
          x,
          y: (arena.clientHeight || 310) + 20,
          speed: Math.random() * 0.75 + 0.7,
          wobbleOffset: Math.random() * Math.PI * 2,
          item,
          isTarget,
          isBonusUnicorn
        };

        const popHandler = (ev) => {
          ev.stopPropagation();
          playMagicSound('pop');
          const rect = el.getBoundingClientRect();
          burstSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 32);

          poppedCount++;
          const counterEl = document.getElementById('balloon-pop-count');
          if (counterEl) counterEl.textContent = poppedCount;

          if (bObj.isBonusUnicorn) {
            playMagicSound('success');
            addStar();
            unicornSpeak("YAAAY! You popped the magic Unicorn Balloon! Bonus Star!", { updateBubble: false });
          } else if (bObj.isTarget) {
            playMagicSound('success');
            addStar();
            unicornSpeak(`POP! ${item.letter} says ${item.phonetic} for ${item.word}! You got a Star!`, { updateBubble: false });
          } else {
            unicornSpeak(`${item.letter}! ${item.phonetic} for ${item.word}!`, { updateBubble: false });
          }

          el.remove();
          activeBalloons = activeBalloons.filter(b => b !== bObj);
        };

        el.addEventListener('pointerdown', popHandler);
        arena.appendChild(el);
        activeBalloons.push(bObj);
      }

      // Spawn 4 initial balloons immediately
      for (let i = 0; i < 4; i++) {
        spawnBalloon();
        activeBalloons[activeBalloons.length - 1].y -= i * 65;
      }

      function stepBalloons(ts) {
        if (currentWorld !== 'balloon') return;
        if (ts - lastSpawn > 1150 && activeBalloons.length < 7) {
          spawnBalloon();
          lastSpawn = ts;
        }
        for (let i = activeBalloons.length - 1; i >= 0; i--) {
          const b = activeBalloons[i];
          b.y -= b.speed;
          const sway = Math.sin(ts * 0.003 + b.wobbleOffset) * 8;
          b.el.style.transform = `translate3d(${b.x + sway}px, ${b.y}px, 0)`;
          if (b.y < -110) {
            b.el.remove();
            activeBalloons.splice(i, 1);
          }
        }
        balloonLoopId = requestAnimationFrame(stepBalloons);
      }

      balloonLoopId = requestAnimationFrame(stepBalloons);
      unicornSpeak(`Balloon Pop time! Tap any floating balloon to pop it! Pop ${targetItem.letter} for ${targetItem.word} to win bonus stars!`);
    }

    /*************************************************************************
     * WORLD 9: 🍬 UNICORN CANDY CRUSH (5-Year-Old Friendly Match & Crush!)
     *************************************************************************/
    const CANDY_TYPES = ['🧁', '🍓', '🍭', '💎', '🌈'];

    function startCandyWorld() {
      const ROWS = 5;
      const COLS = 5;
      let board = [];
      let selectedCell = null;
      let crushBusy = false;
      let crushedTotal = 0;

      currentSoundOutCallback = () => {
        unicornSpeak("Tap matching candies next to each other, or swap any two candies to crush them and win stars!", { updateBubble: false });
      };

      const showcase = document.getElementById('showcase-card');
      showcase.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; flex-wrap:wrap; gap:8px;">
          <div style="font-size:1.05rem; font-weight:700; color:#880e4f;">
            🍬 Tap matching candies or swap 2 candies!
          </div>
          <div class="phonics-pill">
            🍬 Crushed: <strong id="candy-crush-score">0</strong> (Every 10 = ⭐!)
          </div>
        </div>
      `;

      const area = document.getElementById('interactive-area');
      area.innerHTML = `<div class="candy-board" id="candy-board"></div>`;
      const boardEl = document.getElementById('candy-board');

      function randomCandy() {
        return CANDY_TYPES[Math.floor(Math.random() * CANDY_TYPES.length)];
      }

      function initBoard() {
        board = [];
        for (let r = 0; r < ROWS; r++) {
          const row = [];
          for (let c = 0; c < COLS; c++) {
            row.push(randomCandy());
          }
          board.push(row);
        }
        // Guarantee at least a couple adjacent pairs for instant 5-year-old fun
        board[2][2] = board[2][3];
        board[1][1] = board[2][1];
      }

      function getConnectedGroup(startR, startC) {
        const target = board[startR][startC];
        const visited = new Set();
        const queue = [[startR, startC]];
        const group = [];

        while (queue.length > 0) {
          const [r, c] = queue.shift();
          const key = `${r},${c}`;
          if (visited.has(key)) continue;
          visited.add(key);
          if (board[r][c] === target) {
            group.push([r, c]);
            [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr, nc]) => {
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !visited.has(`${nr},${nc}`)) {
                queue.push([nr, nc]);
              }
            });
          }
        }
        return group;
      }

      function findAllMatches3OrMore() {
        const matched = new Set();
        // Horizontal 3+
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS - 2; c++) {
            const v = board[r][c];
            if (v && board[r][c+1] === v && board[r][c+2] === v) {
              matched.add(`${r},${c}`);
              matched.add(`${r},${c+1}`);
              matched.add(`${r},${c+2}`);
            }
          }
        }
        // Vertical 3+
        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r < ROWS - 2; r++) {
            const v = board[r][c];
            if (v && board[r+1][c] === v && board[r+2][c] === v) {
              matched.add(`${r},${c}`);
              matched.add(`${r+1},${c}`);
              matched.add(`${r+2},${c}`);
            }
          }
        }
        return Array.from(matched).map(s => s.split(',').map(Number));
      }

      function crushCoordinates(coords) {
        if (!coords.length) return;
        crushBusy = true;
        playMagicSound('sparkle');

        coords.forEach(([r, c]) => {
          const cellEl = document.getElementById(`candy-${r}-${c}`);
          if (cellEl) {
            cellEl.classList.add('crushing');
            const rect = cellEl.getBoundingClientRect();
            burstSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 14);
          }
          board[r][c] = null;
        });

        const prevTens = Math.floor(crushedTotal / 10);
        crushedTotal += coords.length;
        const newTens = Math.floor(crushedTotal / 10);

        const scoreEl = document.getElementById('candy-crush-score');
        if (scoreEl) scoreEl.textContent = crushedTotal;

        if (newTens > prevTens) {
          addStar();
          playMagicSound('success');
          const praise = GIRLY_PRAISES[Math.floor(Math.random() * GIRLY_PRAISES.length)];
          unicornSpeak(`${praise} You crushed ${crushedTotal} candies and won a Rainbow Star!`, { updateBubble: false });
        } else if (coords.length >= 4) {
          unicornSpeak(`Whoa! Super ${coords.length} candy crush!`, { updateBubble: false });
        } else {
          unicornSpeak(`${coords.length}! Sweet crush!`, { updateBubble: false });
        }

        setTimeout(() => {
          // Gravity drop down
          for (let c = 0; c < COLS; c++) {
            let emptyRow = ROWS - 1;
            for (let r = ROWS - 1; r >= 0; r--) {
              if (board[r][c] !== null) {
                board[emptyRow][c] = board[r][c];
                if (emptyRow !== r) board[r][c] = null;
                emptyRow--;
              }
            }
            for (let r = emptyRow; r >= 0; r--) {
              board[r][c] = randomCandy();
            }
          }
          renderCandyBoard();
          crushBusy = false;
        }, 340);
      }

      function handleCandyTap(r, c) {
        if (crushBusy) return;

        // Kid-friendly Rule 1: If this candy is already part of a touching group of 2+ same candies,
        // and nothing is selected yet, tapping it crushes the whole group immediately!
        if (!selectedCell) {
          const group = getConnectedGroup(r, c);
          if (group.length >= 2) {
            crushCoordinates(group);
            return;
          }
          selectedCell = { r, c };
          playMagicSound('pop');
          renderCandyBoard();
          return;
        }

        // If tapping the same cell, deselect
        if (selectedCell.r === r && selectedCell.c === c) {
          selectedCell = null;
          renderCandyBoard();
          return;
        }

        // Swap the two tapped cells!
        const r1 = selectedCell.r, c1 = selectedCell.c;
        selectedCell = null;
        const tmp = board[r1][c1];
        board[r1][c1] = board[r][c];
        board[r][c] = tmp;
        renderCandyBoard();

        // Check for 3-in-a-row OR connected group of 2+ at either swapped position
        const matches3 = findAllMatches3OrMore();
        if (matches3.length >= 3) {
          crushCoordinates(matches3);
          return;
        }
        const g1 = getConnectedGroup(r, c);
        const g2 = getConnectedGroup(r1, c1);
        const combined = [... (g1.length >= 2 ? g1 : []), ... (g2.length >= 2 ? g2 : [])];
        if (combined.length >= 2) {
          crushCoordinates(combined);
        } else {
          playMagicSound('pop');
        }
      }

      function renderCandyBoard() {
        boardEl.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.id = `candy-${r}-${c}`;
            const isSel = selectedCell && selectedCell.r === r && selectedCell.c === c;
            cell.className = 'candy-cell' + (isSel ? ' selected' : '');
            cell.textContent = board[r][c];
            cell.onclick = () => handleCandyTap(r, c);
            boardEl.appendChild(cell);
          }
        }
      }

      initBoard();
      renderCandyBoard();
      unicornSpeak("Unicorn Candy Crush! Tap any matching candies next to each other, or tap two candies to swap and crush them!");
    }

    /*************************************************************************
     * FREE PLAY SOUNDBOARD (Inside ABCs -> Free Soundboard)
     *************************************************************************/
    function startExploreWorld() {
      const showcase = document.getElementById('showcase-card');
      showcase.innerHTML = `
        <div class="big-prompt-display" id="explore-banner" style="font-size:1.6rem;">
          <span>🦄</span>
          <span>Tap any tile to hear me sound it out!</span>
        </div>
      `;

      const area = document.getElementById('interactive-area');
      area.innerHTML = `<div class="explore-grid" id="explore-grid"></div>`;
      const grid = document.getElementById('explore-grid');

      ALPHABET.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'explore-key';
        btn.innerHTML = `<span>${item.letter}${item.letter.toLowerCase()}</span><small>${item.emoji}</small>`;
        btn.onclick = () => {
          playMagicSound('sparkle');
          const r = btn.getBoundingClientRect();
          burstSparkles(r.left + r.width / 2, r.top + r.height / 2, 22);
          document.getElementById('explore-banner').innerHTML = `
            <span>${item.emoji}</span>
            <span>${item.letter}${item.letter.toLowerCase()} says "${item.phonetic}" (${item.word})</span>
          `;
          unicornSpeak(`${item.letter}! | ${item.letter} says ${item.phonetic}! | ${item.soundCue}, ${item.word}!`, { isSoundOut: true });
        };
        grid.appendChild(btn);
      });

      unicornSpeak("Tap any letter to hear its unicorn phonics sound!");
    }

    /*************************************************************************
     * WORLD 10: ROYAL CLOSET (Dress Up Princess Sparkle!)
     *************************************************************************/
    function startClosetWorld() {
      const showcase = document.getElementById('showcase-card');
      showcase.innerHTML = `
        <div style="font-size:1.2rem; font-weight:700; color:#ad1457;">
          👑 Royal Closet — You have ⭐ ${stars} Stars!
        </div>
        <div style="font-size:0.95rem; color:#6a1b9a; font-weight:700;">
          Tap any unlocked item to dress me up!
        </div>
      `;

      const area = document.getElementById('interactive-area');
      area.innerHTML = `<div class="closet-grid" id="closet-grid"></div>`;
      const grid = document.getElementById('closet-grid');

      ROYAL_CLOSET.forEach(item => {
        const unlocked = stars >= item.stars;
        const card = document.createElement('div');
        card.className = `closet-card ${item.equipped ? 'equipped' : ''} ${!unlocked ? 'locked' : ''}`;
        card.innerHTML = `
          <div style="font-size:2.4rem;">${item.emoji}</div>
          <div style="font-weight:700; color:#880e4f; font-size:0.95rem;">${item.name}</div>
          <div style="font-size:0.85rem; font-weight:700; color:#d81b60; margin-top:3px;">
            ${unlocked ? (item.equipped ? '✅ Wearing!' : '✨ Wear!') : `🔒 ⭐ ${item.stars}`}
          </div>
        `;
        card.onclick = () => {
          if (!unlocked) {
            playMagicSound('oops');
            unicornSpeak(`Ooh, you need ${item.stars} stars for the ${item.name}! Play some more games with me to unlock it!`);
            return;
          }
          const wasEquipped = item.equipped;
          ROYAL_CLOSET.filter(i => i.slot === item.slot).forEach(i => i.equipped = false);
          item.equipped = !wasEquipped;

          const slotEl = document.getElementById(item.slot);
          if (item.equipped) {
            slotEl.textContent = item.emoji;
            slotEl.style.display = 'block';
            playMagicSound('success');
            burstSparkles(window.innerWidth / 2, 180, 35);
            unicornSpeak(`YAAAY! Look at my ${item.name}! Do I look super cute?!`);
          } else {
            slotEl.style.display = 'none';
            playMagicSound('pop');
          }
          startClosetWorld();
        };
        grid.appendChild(card);
      });

      unicornSpeak("Welcome to my Royal Closet! Let's play dress up!");
    }

    /*************************************************************************
     * 5. SPARKLE & STAR PARTICLE ENGINE
     *************************************************************************/
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function burstSparkles(x, y, count = 40) {
      const colors = ['#ff1493', '#ffd700', '#00e5ff', '#d500f9', '#00e676', '#ff80ab'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8.5 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.5,
          size: Math.random() * 10 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          rotation: Math.random() * 360
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.22;
        p.alpha -= 0.018;
        p.rotation += 6;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        for (let s = 0; s < 4; s++) {
          ctx.lineTo(0, -p.size);
          ctx.rotate(Math.PI / 4);
          ctx.lineTo(0, -p.size * 0.4);
          ctx.rotate(Math.PI / 4);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    window.addEventListener('DOMContentLoaded', () => {
      setWorld('abc');
    });
  </script>
